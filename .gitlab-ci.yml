# ---------------------------------------------------------------------------
# ⭐⭐⭐ **ท่อของ main หลังกดรวม ⛔ ไม่ตรวจซ้ำของที่ตรวจผ่านแล้ว** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/123 ทาง ข)
#
# **ทำไม** ⇒ ทุกการกดรวมเคยจ่ายท่อ 2 รอบ ⇒ ของจริง ⇒ คอมมิตรวม `b3dc84b` มีต้นไม้ไฟล์ **เท่ากับ** หัวกิ่งของ !142 ทุกไบต์
#   ⇒ ท่อ 11490 ของคำขอรวมตรวจผ่านไปแล้ว ⇒ แต่ท่อ 11497 ของ main ยังวิ่งด่านชุดเดิมอีก 101 งาน 49.8 นาที
#   ⇒ เว็บที่ทดลองขึ้นช้ากว่าที่ควร 50 นาที และกินคิวของคำขอรวมอื่นบนตัวรันตัวเดียว
#
# **ทำงานยังไง** ⇒ ท่อของ main ที่เกิดจากการดันมี 3 ชั้น
#   ① `ตัดสินตรวจซ้ำบนmain` ⇒ อ่านกิตแล้วเขียนไฟล์ท่อลูก ⇒ **กติกา 3 ข้ออยู่หัวไฟล์ `tools/ตัดสินตรวจซ้ำบนmain.py`** ⛔ ไม่จดซ้ำที่นี่
#      ⇒ ข้าม ⇒ ท่อลูกมีงานเดียวที่พิมพ์เหตุผล พร้อมลิงก์คำขอรวมกับท่อที่ตรวจหัวกิ่งนั้นผ่านแล้ว
#      ⇒ ตรวจเต็ม ⇒ ท่อลูกคือ **ไฟล์นี้ทั้งไฟล์** ⇒ ด่านทุกตัววิ่งเหมือนก่อนมีใบ #123 (กฎ `parent_pipeline` ในก้อน `.ทุกที่`)
#   ② `ตรวจบนmain` ⇒ สร้างท่อลูกจากไฟล์นั้น ⇒ `strategy: depend` ⇒ **ท่อลูกแดง = งานนี้แดง**
#   ③ `pages` อยู่ stage `deploy` ⇒ รอ stage `ตรวจ` ซึ่งมี `ตรวจบนmain` ⇒ **ท่อลูกยังไม่เขียว เว็บ ⛔ ไม่ถูกวาง**
#      ⇒ และ `pages` ยังสร้างเว็บจากคอมมิตของ main เอง ⇒ ตัวประทับยังเป็นเวลาของคอมมิตนั้น (ใบงาน #101 ข้อ 17)
#
# ⛔⛔ **ห้ามถอด**
#   ⇒ `strategy: depend` ⇒ ถอดแล้ว `ตรวจบนmain` เขียวทันทีที่สร้างท่อลูกได้ ⇒ **เว็บถูกวางก่อนด่านในท่อลูกวิ่งจบ**
#   ⇒ `--ทดสอบตัวเอง` บรรทัดแรกของ `ตัดสินตรวจซ้ำบนmain` ⇒ ตัวตัดสินพังเมื่อไร ท่อ main แดงก่อนจะได้ข้ามอะไร
#   ⇒ ⛔ **อย่าเปลี่ยนกติกาไปดูชื่อกิ่งหรือข้อความคอมมิต** ⇒ ใบ #123 ข้อ 6.1 ห้ามไว้ตรง ๆ ⇒ ปลอมได้ด้วยมือ
# ---------------------------------------------------------------------------
ตัดสินตรวจซ้ำบนmain:
  stage: สร้าง
  image: python:3.13-alpine
  <<: *main_push_only
  needs: []
  # ⭐ ต้องเห็นพ่อแม่ทั้ง 2 ตัวของคอมมิตรวม ⇒ ความลึก 20 ของโครงการพออยู่แล้ว ⇒ เขียนไว้ให้เห็นว่าพึ่งข้อนี้
  #   ⇒ ⛔ ตื้นเกินจนอ่านพ่อแม่ไม่ได้ ⇒ ตัวตัดสินตอบ *พิสูจน์ไม่ได้ ⇒ ตรวจเต็ม* ⛔ ไม่ข้ามเงียบ ๆ
  variables:
    GIT_DEPTH: '20'
  script:
    - apk add --no-cache git >/dev/null
    # ⭐ พิสูจน์ก่อนว่าตัวตัดสินยังจับ 3 กรณีที่ต้องไม่ข้ามได้ ⇒ ในท่อเดียวกับที่มันจะตัดสินจริง
    - python3 tools/ตัดสินตรวจซ้ำบนmain.py --ทดสอบตัวเอง
    - python3 tools/ตัดสินตรวจซ้ำบนmain.py --ท่อลูก gates-on-main.yml
  artifacts:
    paths:
      - gates-on-main.yml
    expire_in: 1 week

ตรวจบนmain:
  stage: ตรวจ
  <<: *main_push_only
  needs: ['ตัดสินตรวจซ้ำบนmain']
  # ⛔⛔ **ห้ามส่งตัวแปรก้อนบนสุดของไฟล์ลงท่อลูก** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/123)
  #   ⇒ งานที่ `trigger:` ส่งตัวแปรก้อนบนลงไปเป็น **ตัวแปรของท่อ** ⇒ ซึ่ง **ชนะตัวแปรของงาน** ในท่อลูก
  #   ⇒ `GIT_LFS_SKIP_SMUDGE: '1'` จึงทับ `'0'` ของ `.เอาซองตัวบท` ⇒ งานที่ต้องใช้ `_data/` ได้ **ตัวชี้ของ LFS**
  #   ⇒ ตัวรัน 7 ผ่านเพราะ **โชค** ⇒ `/builds` ค้างไบต์จริงจากงานก่อน แล้ว checkout ⛔ ไม่เขียนไฟล์ที่ไม่เปลี่ยนทับ
  #   ⇒ ตัวรัน 10 ที่ `/builds` ยังใหม่ ⇒ ตายทันที (ท่อลูก 11658 · 11659 ⇒ พ่นรอยย่อหน้า · ด่านเสียงตรงตัวบท · ด่านรูปผันเป็นไทย)
  #   **วิธีดูของจริง** ⇒ `GET /projects/58/pipelines/<ท่อลูก>/variables` ⇒ ⛔ ต้องไม่มี `GIT_LFS_SKIP_SMUDGE`
  # ⭐ ถอดแล้ว ⛔ ไม่เสียอะไร ⇒ ท่อลูกคือไฟล์นี้ทั้งไฟล์ ⇒ ได้ตัวแปรก้อนบนจากตัวเองอยู่แล้ว
  #   ⇒ ท่อลูกแบบข้ามมีงานเดียวที่ `GIT_STRATEGY: none` ⇒ ⛔ ไม่โคลน ⇒ ⛔ ไม่แตะ LFS
  inherit:
    variables: false
  trigger:
    include:
      - artifact: gates-on-main.yml
        job: ตัดสินตรวจซ้ำบนmain
    strategy: depend

# ---------------------------------------------------------------------------
# ฝาแฝด — **ตัวตัดสินข้างบนยังจับได้อยู่ไหม** (ใบงาน #123 ข้อ 7)
#   ⇒ ปั้นที่เก็บจำลองแล้วยืนยันว่า ⇒ ① main ขยับก่อนรวม · ② แก้ไฟล์เพิ่มหลังรวม (ต่อท้าย และแก้ในคอมมิตรวมเอง)
#     · ③ ดันเข้า main ตรง ๆ · ④ รวมกิ่งในเครื่องที่ไม่ใช่คำขอรวม · ⑤ อ่านคอมมิตไม่ได้ ⇒ **ต้องตรวจเต็มทุกกรณี**
#   ⇒ และกรณี ⓪ กิ่งตามทัน main แล้วกดรวม ⇒ **ต้องข้ามจริง** ⇒ ⛔ ไม่งั้นข้อข้างบนผ่านได้ด้วยตัวตัดสินที่ไม่เคยข้ามอะไรเลย
# ⭐ `*everywhere` ⇒ วิ่งทุกคำขอรวม ⇒ ใครแก้ตัวตัดสินจนข้ามผิดกรณี จะแดงตั้งแต่ก่อนกดรวม
# ---------------------------------------------------------------------------
ด่านตัดสินตรวจซ้ำยังจับได้:
  stage: ตรวจ
