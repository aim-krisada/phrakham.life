# ที่อยู่: https://v3.aimagin.com/<ชื่อโปรเจกต์>/ (ต้องล็อกอินอัมกิตก่อน)
# ⛔ ห้ามเชื่อ echo 3 บรรทัดท้าย job `pages` ว่าเป็นของตกค้าง — มันคือคำพูดของเซิร์ฟเวอร์เอง
#    ว่ากำลังวางเว็บที่ที่อยู่ไหน ใช้ตรวจตอนย้ายชื่อโฮสต์ · วิธีตั้งอยู่ที่ v3/way skills/server.md
#
# --- ของที่ใบงาน #19 เพิ่ม: ตัวสร้างเว็บ Nuxt จริง + ด่านที่ต้องใช้เบราว์เซอร์ 3 ด่าน ---
# โครงของท่อนี้ยกมาจาก v3/pleng ที่วิ่งอยู่จริงแล้ว ⛔ ไม่ลอกทั้งไฟล์
#   ยกมา: การสร้างเว็บครั้งเดียวแล้วให้ทุกด่านหยิบไปใช้ · การดึงฐานของเว็บจาก $CI_PAGES_URL
#          · การเก็บที่พัก npm ตาม package-lock.json · การใช้ภาพของ playwright สำหรับ job ที่เปิดเบราว์เซอร์
#   ⛔ ไม่ยกมา: ทุกอย่างที่เกี่ยวกับคลังเพลง Supabase · การปล่อยขึ้น GitHub · ด่านความเร็ว

variables:
  # ⭐ **ห้ามดึงไบต์จริงของ source/ (LFS 450 MiB)** — เว็บ ⛔ ไม่ได้ใช้เลยสักไฟล์
  #   **วิธีดูของจริงว่าไม่ได้ดึง** ⇒ ต้น log ของ job ⛔ ต้องไม่มีบรรทัด `Downloading source/…`
  GIT_LFS_SKIP_SMUDGE: '1'
  # ⭐ **ตัวอัด-แตกไฟล์แบบเร็วของตัวรัน** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/123 ทาง ก)
  #   ⇒ ชิ้นงานของ `สร้างเว็บ` 110 MB (เสียง 83 MB) ⇒ **ด่านราว 60 งานต้องดึงไปแตกทุกท่อ**
  #   ⇒ ท่อ 11490 ⇒ เวลา *ดึงชิ้นงาน* รวม 12 นาที ⇒ ก้อนใหญ่ที่สุดในเวลาเตรียมงาน
  #   ⇒ `FF_USE_FASTZIP` คือตัวอัด-แตกที่กิตแล็บแนะนำเองสำหรับชิ้นงานใหญ่ ⇒ ⛔ ไม่เปลี่ยนไฟล์ข้างในแม้แต่ไบต์เดียว
  #   ⇒ `fast` ⇒ บีบน้อยลงตอนอัด ⇒ เสียง mp3 บีบไม่ลงอยู่แล้ว ⇒ เสียเวลาบีบเปล่า ๆ
  #   **วิธีดูของจริง** ⇒ บันทึกของงานที่ `needs: ['สร้างเว็บ']` ส่วน `download_artifacts`
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: fast
  CACHE_COMPRESSION_LEVEL: fast

# ---------------------------------------------------------------------------
# ⭐⭐ **job ที่ต้องอ่านซองตัวบท ต้องปลดตัวข้าม LFS ทิ้ง** (ใบงาน v3/phrakham#24)
#
# ⇒ ปลดแล้ว **ยังไม่โหลด `source/` อยู่ดี** เพราะ `.lfsconfig` เขียนกันไว้เองว่า `fetchexclude = source/*`
#   ⇒ ที่โหลดมาคือ `_data/` อย่างเดียว ⛔ ไม่เขียนขนาดไว้ที่นี่ เพราะมันโตขึ้นทุกครั้งที่เพิ่มชั้นข้อมูล
#     **วิธีดูของจริง** ⇒ `git lfs ls-files -s -I "_data/"`
#   ⇒ ⭐ `.lfsconfig` เขียนกำกับตัวเองไว้ตั้งแต่ต้นว่า **CI ต้องใช้ไบต์จริงของ `_data/`**
#
# ⛔ ไม่ปลด = ได้ตัวชี้แทนไบต์จริง ⇒ ตัวสร้างเว็บตายพร้อมบอกว่า "เป็นตัวชี้ของ Git LFS"
#   ⇒ **ตายพร้อมบอกวิธีแก้ ดีกว่าสร้างเว็บออกมาแล้วไม่มีบทสักบท**
.เอาซองตัวบท: &lfs_data
  variables:
    GIT_LFS_SKIP_SMUDGE: '0'

# ---------------------------------------------------------------------------
# ⭐⭐ **งานที่ต้องใช้ *ไบต์จริงของไฟล์เสียง* ต้องสั่งดึงเอง** (ใบงาน v3/phrakham#100)
#
# `.lfsconfig` กัน `เสียง/*` ไว้ ⇒ **เหตุผลเต็มอยู่ในไฟล์นั้น** ⛔ ไม่จดซ้ำที่นี่
# ⇒ มีแค่ **4 งานที่สร้างเว็บ** ที่ต้องใช้ ⇒ `สร้างเว็บ` `pages` `ซ้อมปล่อยเว็บ` `ปล่อยเว็บ`
#   ⇒ ตัวสร้างคัดลอกกองนี้เข้าเว็บให้เอง (`nitro.publicAssets` ใน `nuxt.config.ts`)
# ⛔ **ลืมสั่งในงานไหน ⇒ เว็บที่งานนั้นสร้างจะมีตัวชี้ของ LFS 130 ไบต์แทนเสียง**
#   ⇒ หน้าเปิดได้ · กดฟังได้ · **แต่ ⛔ ไม่มีเสียง** ⇒ `tools/ด่านฟังพระคำบนหน้า.mjs` ข้อ ④ ⑤ จับได้
# ⛔ `-c lfs.fetchexclude=` ขาดไม่ได้ ⇒ ⛔ ไม่ปลด มันจะเคารพรายชื่อที่กันไว้แล้ว ⛔ ไม่ดึงอะไรเลย
#   ⇒ ⭐ `-I "เสียง/"` จำกัดให้ดึงแค่กองนี้ ⇒ `source/` 450 MiB ยัง ⛔ ไม่ถูกดึงมาอยู่ดี
# ---------------------------------------------------------------------------
.ดึงไบต์จริงของเสียง: &pull_audio
  # ⛔⛔ **ภาพ `node:24-alpine` ⛔ ไม่มี git และ ⛔ ไม่มี git-lfs**
  #   ⇒ ตอนโคลน ตัวรันใช้ **ภาพผู้ช่วย** ซึ่งมีให้ ⇒ แต่ `script` วิ่งในภาพของงาน ⇒ **คนละที่**
  #   ⇒ ⛔ ไม่ติดตั้งก่อน = `git: not found` ⇒ หลักฐานว่าภาพนี้ไม่มีคือบรรทัด `apk add git curl`
  #     ที่งาน `ปล่อยเว็บ` เขียนไว้เองอยู่แล้ว
  # ⭐⭐ **เสียงย้ายไป GitHub Pages แล้ว ⇒ ⛔ ไม่ต้องดึง** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/171)
  #   ⇒ รายการเสียงมี `ฐานของฉบับ` ⇒ `nuxt.config.ts` ⛔ ไม่คัดลอก mp3 เข้าเว็บ ⇒ ดึงมาก็ทิ้งเปล่า ๆ ราว 180 MB ต่องาน
  #   ⇒ ⭐ เงื่อนไขเดียวกับ `เสียงอยู่บนGitHub` ใน `nuxt.config.ts` ทุกตัวอักษร ⇒ ไม่มีรายการ = ดึงเหมือนเดิม
  #   ⇒ ⛔ ชื่อตัวแปรของเชลล์เป็นภาษาไทยไม่ได้ ⇒ จึงใช้ `SKIP_AUDIO`
  - |
    SKIP_AUDIO=0
    if [ -s _พ่น/รายการเสียง.json ] && grep -q '"ฐานของฉบับ":{"' _พ่น/รายการเสียง.json; then
      SKIP_AUDIO=1
      echo "⏭ เสียงอยู่บน GitHub Pages แล้ว ⇒ ⛔ ไม่ดึงไบต์จริงของ เสียง/ ⇒ ตัวสร้างเว็บ ⛔ ไม่คัดลอก mp3"
    fi
    echo "$SKIP_AUDIO" > /tmp/skip_audio
  # ⭐⭐ **เสียงเรื่องเล่า ⛔ ไม่ได้ย้ายไป GitHub** ⇒ `nuxt.config.ts` คัดลอก `เสียง/เรื่องเล่า/` เข้าเว็บเสมอ ⇒ ต้องดึงทุกครั้ง
  #   ⇒ ⚠️ `.lfsconfig` ตัด `เสียง/*` และท่อตั้ง `GIT_LFS_SKIP_SMUDGE` ⇒ ตอนโคลนได้ตัวชี้เสมอ ⇒ ถูกต้องตามที่ออกแบบ
  #     ⇒ ที่เคยผ่าน เพราะ `/builds` ของตัวรันเก่ามีไบต์จริงค้างจากงานรอบก่อน ⇒ runner-dell (18 พ.ย. 2569) เริ่มจากศูนย์
  #     ⇒ เว็บได้ตัวชี้แทน mp3 ⇒ กดฟังเรื่องเล่าแล้วเงียบ ⇒ ด่านเรื่องเล่าบนหน้า ข้อ ⑤ ⑨ กับ ด่านหน้าเล่าประสบการณ์ ข้อ ④ แดง (ท่อ 12049)
  #   ⇒ ⛔ ห้ามพึ่งตัวรัน ⇒ ดึงเองตรงนี้
  - 'command -v git-lfs >/dev/null 2>&1 || apk add --no-cache git git-lfs'
  - 'if [ "$(cat /tmp/skip_audio)" = 1 ]; then git -c lfs.fetchexclude= lfs pull -I "เสียง/เรื่องเล่า/"; else git -c lfs.fetchexclude= lfs pull -I "เสียง/"; fi'
  # ⛔ **พิสูจน์ว่าได้ไบต์จริง ⛔ ไม่ใช่ตัวชี้** ⇒ ตายตรงนี้ดีกว่าปล่อยเว็บเงียบ ๆ ที่กดฟังแล้วไม่มีเสียง
  - |
    for f in เสียง/เรื่องเล่า/*.mp3; do
      if head -c 40 "$f" | grep -q "git-lfs"; then
        echo "⛔ $f ยังเป็นตัวชี้ของ Git LFS ⛔ ไม่ใช่ไบต์จริง ⇒ กดฟังเรื่องเล่าแล้วจะเงียบ"
        exit 1
      fi
    done
    echo "✅ ไบต์จริงของเสียงเรื่องเล่าพร้อมแล้ว ⇒ $(du -sh เสียง/เรื่องเล่า | cut -f1)"
    if [ "$(cat /tmp/skip_audio)" = 1 ]; then
      :
    elif head -c 40 "เสียง/ข้อ/Acts.1.1.puck.mp3" | grep -q "git-lfs"; then
      echo "⛔ เสียง/ ยังเป็นตัวชี้ของ Git LFS ⛔ ไม่ใช่ไบต์จริง ⇒ การดึงล้มเหลว"
      exit 1
    fi
    [ "$(cat /tmp/skip_audio)" = 1 ] || echo "✅ ไบต์จริงของเสียงพร้อมแล้ว ⇒ $(du -sh เสียง/ข้อ | cut -f1)"

stages:
  - สร้าง
  - ตรวจ
  - deploy
  # ⏸ **ที่ของด่าน `ด่านเว็บขึ้นจริง` ซึ่งยัง ⛔ ไม่ได้เปิด เพราะกุญแจอ่าน ⛔ ไม่ได้**
  #   ⇒ เรื่องเต็มอยู่เหนืองาน `ด่านเว็บขึ้นจริงยังจับได้`
  #   ⛔ stage ที่ยัง ⛔ ไม่มีงานไหนใช้ **⛔ ไม่ทำให้ท่อพัง** ⇒ กิตแล็บข้ามมันไปเฉย ๆ
  #   ⇒ ⭐ เก็บไว้เพื่อให้วันที่เคาะเรื่องกุญแจแล้ว **เปิดได้ด้วยการลบ `#` อย่างเดียว**
  - ทาน

# ⭐⭐ **`--ignore-scripts` ⛔ ไม่ใช่ทางลัด — ถ้าไม่ใส่ ท่อนี้สร้างเว็บไม่ผ่านเลย**
#
# **ของจริงที่พังมาแล้ว** (29 ส.ค. 2569 · job 37351) — `npm ci` เห็นว่า better-sqlite3 มี `binding.gyp`
#   จึงสั่ง `node-gyp rebuild` ให้เอง ⇒ ภาพ alpine ⛔ ไม่มี python ⇒ **ล้มทันที**
# ⇒ ⭐ **แต่การคอมไพล์นั้น ⛔ ไม่จำเป็นเลย** — better-sqlite3 13 แนบไฟล์สำเร็จรูปมาให้ทุกแพลตฟอร์ม
#   และตัวมันเองก็หยิบจากที่นั่น ⛔ ไม่ได้หยิบจากของที่คอมไพล์
#   **วิธีดูของจริง** ⇒ `grep -n prebuilds node_modules/better-sqlite3/lib/binding.js`
# ⇒ ของแถมที่ได้มาด้วย: สคริปต์ติดตั้งของก้อนอื่นอีก 900 กว่าก้อน ⛔ ไม่ได้ถูกรันในท่อของเรา
# ⛔ **`postinstall: nuxt prepare` ก็ถูกข้ามไปด้วย** ⇒ ⛔ ไม่เป็นไร `nuxt generate` ทำขั้นนั้นเองอยู่แล้ว
#   (พิสูจน์ในเครื่อง 29 ส.ค. 2569: ลบ node_modules ⇒ `npm ci --ignore-scripts` ⇒ `npm run generate` ⇒ ผ่าน)
#
# node:24-alpine ⇒ ให้ตรงกับรุ่นที่ใช้ในเครื่อง
#
# ⭐⭐ **แคชอ่านอย่างเดียว (`policy: pull`) ⇒ อัปกลับแค่งาน `สร้างเว็บ` งานเดียว** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/123 ทาง ก)
#   **ทำไม** ⇒ ค่าตั้งต้นของกิตแล็บคือ *ดึงตอนเริ่ม อัปกลับตอนจบ* ⇒ **ทุกงานอัดแคช 5,244 ไฟล์ใหม่ทั้งก้อน**
#     ทั้งที่ชื่อแคชผูกกับ `package-lock.json` ⇒ lock ไม่ขยับ ของในแคชก็ไม่ขยับ ⇒ อัปซ้ำเปล่า ๆ
#     ⇒ ท่อ 11490 ⇒ *อัปแคชกลับ* รวม 5 นาที โดย ⛔ ไม่ได้อะไรเพิ่ม
#   ⇒ `สร้างเว็บ` วิ่งทุกท่อ และวิ่งก่อนงาน node ตัวอื่น ⇒ lock เปลี่ยนเมื่อไร มันอัปแคชชุดใหม่ให้ในท่อนั้นเลย
#   ⛔ **อย่าเปลี่ยนงานอื่นเป็น `pull-push`** ⇒ เวลาที่ประหยัดได้จะกลับมาเท่าเดิม
.node: &node
  image: node:24-alpine
  cache: &npm_cache
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull

# ภาพของ playwright มีเบราว์เซอร์มาแล้ว ⇒ ⛔ ไม่ต้องโหลดใหม่ทุกรอบ (เผาเวลา)
# ⇒ เลขรุ่นต้องตรงกับ playwright ใน package-lock.json ไม่งั้นมันจะไปหาเบราว์เซอร์ที่ไม่มี
# ⛔ ชื่อ anchor (`&…`) ต้องเป็นอักษรอังกฤษ — YAML ⛔ ไม่รับตัวไทย
#    (ท่อล้มทั้ง pipeline ทันทีโดย ⛔ ไม่มี job ไหนเกิดเลย · เจอเอง 29 ส.ค. 2569)
#    **วิธีดูของจริง** ⇒ ยิง `POST /api/v4/projects/:id/ci/lint` แล้วอ่านช่อง `errors`
#
# ⭐⭐ **job ไหนใช้ `*browser` ต้องใส่ `*ui_changed` ด้วยเสมอ** ⛔ ห้ามใช้คู่กับ `*everywhere`
#   ⇒ เปิดเบราว์เซอร์หนึ่งครั้งกินเวลาหลายสิบวินาที การแก้เอกสารอย่างเดียว ⛔ ไม่ทำให้หน้าเปลี่ยน
#   ของจริงที่พลาดมาแล้ว (8 ก.ย. 2569) — ด่านซ่อนเลข ด่านแถบล่าง และตัวคู่ 'ยังจับได้' ของทั้งสอง
#   เข้ามาทีหลังด้วย `*everywhere` ⇒ แก้เอกสารบรรทัดเดียวก็ยังเปิดเบราว์เซอร์ 4 รอบ
#   **วิธีดูของจริง** ⇒ `grep -n 'browser, \*' .gitlab-ci.yml` ⇒ ทุกบรรทัดต้องมีคำว่า `ui_changed`
#
# ⭐⭐ **งานเบราว์เซอร์ลงแค่ `playwright` กับ `axe-core`** ⛔ ไม่ใช่ `npm ci` เต็ม 1,006 ก้อน
#   (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/123 ทาง ก)
#   ⇒ ไล่ import ทุกชั้นของด่านเบราว์เซอร์แล้ว ใช้แพ็กเกจแค่ 2 ตัวนี้ ⇒ ที่เหลือเป็นของตัวสร้างเว็บ
#   ⇒ รุ่นกับลายนิ้วมือหยิบจาก `package-lock.json` ตัวเดิม ⇒ **เหตุผลเต็มอยู่หัวไฟล์ `tools/ติดตั้งของด่านเบราว์เซอร์.mjs`**
#   ⇒ ท่อ 11490 ⇒ 55 งาน × (`npm ci` 12 วินาที + ดึงแคช 6 + อัปแคช 6) ⇒ **ราว 20 นาทีของเวลางานรวม**
#   ⇒ ⭐ อยู่ใน `before_script` ของก้อนนี้ ⇒ **งานเบราว์เซอร์ใหม่ได้เองโดย ⛔ ไม่ต้องเขียนบรรทัดลงของ**
#   ⛔⛔ **ห้ามใส่ `npm ci` ในงานเบราว์เซอร์อีก** ⇒ แคชข้างล่างเก็บแค่ 3 ก้อนนี้ (ชื่อแคชขึ้นต้น `browser-gates`)
#     ⇒ `npm ci` เต็มจะต้องโหลดพันกว่าก้อนจากเน็ตทุกงาน ⇒ **ช้ากว่าของเดิม**
#   ⇒ แคชอัปกลับแค่ `ด่านย่อหน้าบนหน้า` งานเดียว ⇒ เหตุผลเดียวกับ `policy: pull` ของก้อน `.node` ข้างบน
#
