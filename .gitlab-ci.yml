#   ⇒ ด่านทุกตัวย้ายไปอยู่ **ท่อลูก** ที่งาน `ตรวจบนmain` สร้าง ⇒ ท่อลูกมี 2 แบบ ⇒ ข้าม หรือ ตรวจเต็ม
#   ⇒ ใครเลือกแบบไหน และทำไมปลอดภัย ⇒ ดูหัวข้อเหนืองาน `ตัดสินตรวจซ้ำบนmain`
#   ⇒ บรรทัด `parent_pipeline` ⇒ **ให้ด่านทุกตัววิ่งในท่อลูกแบบตรวจเต็ม** ⛔ ขาดไม่ได้
#     ⇒ ⛔ ขาดไป = ท่อลูกไม่มีงานสักงาน ⇒ สร้างท่อลูกไม่ขึ้น ⇒ ท่อ main แดง ⇒ เว็บไม่ถูกวาง
#   ⇒ ⭐ ท่อของ main ที่ **ไม่ได้เกิดจากการดัน** (`Run pipeline` ที่หน้า Pipelines) ⇒ ⛔ ไม่ตรงบรรทัดแรก
#     ⇒ ด่านวิ่งในท่อแม่ครบเหมือนเดิม ⇒ ทางที่ใช้วางเว็บใหม่โดยไม่แตะโค้ด (ดูหัวข้อเหนืองาน `pages`) ยังใช้ได้
.ทุกที่: &everywhere
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

