#   ⇒ **ทำไมไม่คอมมิตผลเข้า `_data/` แทน** ⇒ `ด่านเทียบต้นทาง` ตรึงลายนิ้วมือทุกไฟล์ใน `_data/`
#     และการตรึงใหม่ต้องมีกอง `_แตก` 4.8 GiB ⇒ พ่นสดจาก zip ที่ตรึงไว้แล้วจึงถูกกว่า
