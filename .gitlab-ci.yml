#     ⇒ งาน `pages` ⛔ ไม่มี `needs` ⇒ หยิบชิ้นงานของทุกงานใน stage ก่อนหน้า **ในท่อเดียวกัน**
#     ⇒ ⛔ ย้ายงานพ่นไปท่อลูกด้วยเมื่อไร ⇒ `pages` สร้างเว็บที่ไม่มีย่อหน้า ไม่มีพจนานุกรม และตัวตั้งค่าเว็บตาย
#   ⇒ งานพ่น **ยังวิ่งในท่อลูกแบบตรวจเต็มด้วย** ⇒ ด่านในท่อลูกที่ `needs` มันต้องหาเจอในท่อเดียวกัน
#   ⇒ ⛔ **ด่านห้ามใช้กฎนี้** ⇒ ใช้แล้วด่านนั้นจะวิ่งซ้ำในท่อแม่ทุกครั้ง แม้ท่อลูกตัดสินว่าข้าม
.ทุกที่รวมmainที่ดัน: &everywhere_build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------------------------
# ⭐ **งานที่มีเฉพาะท่อของ main ที่เกิดจากการดัน** ⇒ `ตัดสินตรวจซ้ำบนmain` กับ `ตรวจบนmain`
#   ⇒ ⛔ ไม่มีบรรทัด `parent_pipeline` ⇒ ท่อลูกที่มันสร้าง ⛔ ไม่สร้างท่อลูกต่ออีกชั้นไม่รู้จบ
