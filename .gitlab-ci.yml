#         *This might be because of the only, except, or rules keywords."*
#      ⇒ ⭐⭐ **คอมมิตเอกสารล้วนบน main จะกลายเป็นท่อที่ ⛔ ไม่เกิดขึ้นเลย** ⇒ ด่านก็ ⛔ ไม่ได้วิ่งสักตัว
#        ⇒ **แย่กว่าของเดิมหลายเท่า** ⇒ ⛔ ไม่ใช่แค่ไม่วางเว็บ แต่คือ **ไม่มีการตรวจอะไรเลย**
#   ② **`needs: optional` ที่กิตแล็บแนะนำในคำผิดพลาดนั้น ⇒ เปิดรูกลับทันที**
#      ⇒ ของจริง `ทดลอง-วางเว็บผูกหลวม` ที่ท่อ 11350 ⇒ ด่านที่มันผูกไว้**แดง** แต่ **ตัวมันยังวิ่งจนสำเร็จ**
#   ③ `needs` **แทนที่ลำดับ stage ⛔ ไม่ใช่เพิ่มเข้าไป**
#      ⇒ ท่อ 11350 ⇒ `ทดลอง-ด่านแดง` ใน stage `ตรวจ` **แดง**
#        ⇒ งานที่ผูกด้วย `needs` (`ทดลอง-วางเว็บผูกแน่น` · `ทดลอง-วางเว็บผูกหลวม`) **ยังวิ่งจนสำเร็จทั้งคู่**
#        ⇒ ส่วนงานที่ใช้กฎอย่างเดียว (`ทดลอง-วางเว็บแบบเดิม` · `ทดลอง-วางเว็บผูกกฎ`) **ขึ้น `skipped` ถูกต้อง**
#      ⇒ ⭐ แปลว่าผูกด้วย `needs` = **ด่านไพทอนแดงค้างอยู่ แต่เว็บขึ้นได้** ⇒ **รูใหม่ที่แย่กว่าเดิม**
#   ④ **ถึงยอมทั้ง 3 ข้อ ก็ยังเขียนไม่ครบอยู่ดี** ⇒ stage `ตรวจ` มี **48 งาน** (ท่อ 11344)
#      ⇒ เพดาน `needs` ของเครื่องนี้คือ **50 รายการต่องาน**
#        **วิธีดูของจริง** ⇒ `GET /api/v4/application/plan_limits` ⇒ `ci_needs_size_limit`
#      ⇒ เหลือที่ให้เติมด่านใหม่อีกแค่ **2 ตัว** ⇒ ตัวที่ 3 ทำให้ **สร้างท่อไม่ขึ้นทั้งท่อ**
#      ⛔⛔ **และ `POST /ci/lint` ⛔ ไม่จับข้อนี้** (ลองยัด 101 รายการแล้วมันตอบ `valid: true`)
#        ⇒ **จะรู้ตัวตอนดันขึ้นจริงแล้วท่อไม่เกิด** ⇒ กับดักเงียบอีกตัว
#
# ⚠️ **ราคาที่ต้องจ่าย** ⇒ คอมมิตที่แก้แต่เอกสารบน `main` **⛔ ไม่วางเว็บอีกต่อไป**
#   ⇒ ⭐ **นั่นคือสิ่งที่ถูกแล้ว** ⇒ เว็บคาอยู่ที่โค้ดชุดล่าสุดที่ด่านครบทุกตัวเขียวให้
#   ⇒ และตัวประทับท้ายหน้าก็ยังตรงกับโค้ดที่หน้านั้นสร้างมาจริง (WPA.08)
#   ⇒ **อยากวางใหม่ทั้งที่ ⛔ ไม่มีใครแตะหน้าจอ** ⇒ สั่งท่อเองจากหน้า Pipelines (`Run pipeline`)
#     ⇒ ท่อที่ ⛔ ไม่ได้เกิดจากการดัน **กิตแล็บถือว่า `changes` เป็นจริงเสมอ** ⇒ ด่านวิ่งครบแล้วค่อยวาง
# ---------------------------------------------------------------------------
# ⇒ **กฎของงานนี้อยู่ที่ `.กฎงานที่ปล่อยของออก`** ⛔ ไม่เขียนซ้ำที่นี่
#   ⇒ ① วางเว็บที่ทดลองจากสาขาหลักเท่านั้น ⇒ ⛔ ไม่จำกัด = สาขาอื่นไปทับเว็บที่ทดลองของ main
#     (ตอนนี้ยังไม่มี `path_prefix` ⇒ มีที่วางเว็บที่เดียว) ⇒ พี่เอมจะเปิดดูแล้วเห็นของสาขาอื่นโดยไม่รู้ตัว
#   ⇒ ② `changes: *ui_paths` คือตัวผูกกับด่านหน้าจอ ⇒ ③ `when: never` คือตัวกันทาง `$CI_OPEN_MERGE_REQUESTS`
pages:
  stage: deploy
  <<: [*node, *lfs_data, *deploy_rules]
  script:
    # ⭐ ไบต์จริงของเสียง ⇒ เหตุผลอยู่ที่ `.ดึงไบต์จริงของเสียง` ⛔ ไม่จดซ้ำที่นี่
    #   ⛔ งานนี้ ⛔ ไม่มี `needs` ⇒ ได้ชิ้นงานของทุก stage ก่อนหน้า ⇒ `_พ่น/รายการเสียง.json` มาเอง
    - *pull_audio
    - npm ci --cache .npm --prefer-offline --ignore-scripts
    # เว็บที่ทดลองอยู่ใต้เส้นทางย่อย ⇒ ต้องบอก Nuxt ไม่งั้นลิงก์กับไฟล์ย่อยจะชี้ไปที่ราก
    # ⭐ ดึงจาก $CI_PAGES_URL เอง ⇒ **โค้ดไม่ผูกกับชื่อโฮสต์** ⇒ ย้ายโฮสต์ก็ยังถูก
    #   (ค่าปริยาย `/phrakham/` อยู่ที่ `nuxt.config.ts` ⇒ ใช้ตอนรันในเครื่อง)
    - |
      BASE=$(printf '%s' "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##')
      case "$BASE" in */) : ;; *) BASE="$BASE/" ;; esac
      [ -n "$BASE" ] || BASE=/
      echo "NUXT_APP_BASE_URL=$BASE"
      export NUXT_APP_BASE_URL="$BASE"
      # $CI_COMMIT_SHORT_SHA เข้าไปเป็น <code id="sha"> ท้ายหน้า ผ่าน nuxt.config.ts
      # ⛔ ไม่ใช้เวลาสร้าง เพราะมันเปลี่ยนทุกครั้งจึงพิสูจน์อะไรไม่ได้
      npm run generate
    - rm -rf public && mv .output/public public
    # พิสูจน์ในบันทึกงานว่าตัวประทับติดไปกับเว็บจริง ⛔ ไม่ใช่เชื่อว่าติด
    # ⛔ อ่านด้วย curl จากข้างนอกไม่ได้ — ที่ทดลองเปิด access control ของอัมกิต ⇒ เด้ง 302 ไปหน้าล็อกอิน
    - grep -o "id=\"sha\">[^<]*" "public/sources/index.html" || (echo "⛔ ไม่มีตัวประทับในหน้าเว็บ" && exit 1)
    # ⭐ **เวลาของคอมมิตต้องติดไปด้วย และต้องเป็นค่าเดียวกับ `CI_COMMIT_TIMESTAMP`** (ใบงาน #101 ข้อ 17)
    #   ⇒ ⛔ ไม่ใช่เวลาที่ท่อสร้างเว็บ ⇒ เทียบตรง ๆ กับค่าที่กิตแล็บบอก ⇒ คนละค่า = แดง
    - grep -o "datetime=\"$CI_COMMIT_TIMESTAMP\"[^<]*" "public/sources/index.html" || (echo "⛔ ตัวประทับ ⛔ ไม่มีเวลาของคอมมิต $CI_COMMIT_TIMESTAMP" && exit 1)
    # ⛔ echo 3 บรรทัดนี้เป็นของสายเซิร์ฟเวอร์ — คำพูดของเซิร์ฟเวอร์ว่ากำลังวางเว็บที่ไหน
    #    ใช้ตรวจตอนย้ายชื่อโฮสต์ ⛔ ไม่ใช่ของตกค้าง ห้ามลบ (ดูหมายเหตุหัวไฟล์)
    - 'echo "CI_PAGES_URL=[$CI_PAGES_URL]"'
    - 'echo "CI_PAGES_DOMAIN=[$CI_PAGES_DOMAIN]"'
    - 'echo "CI_PAGES_HOSTNAME=[$CI_PAGES_HOSTNAME]"'
  artifacts:
    paths:
      - public

# ---------------------------------------------------------------------------
# ซ้อมปล่อย — สร้าง**ชิ้นที่จะปล่อย**แล้วตรวจให้ครบ ⛔ ยังไม่ส่งขึ้นจริง
#
# ⭐ **ทำไมต้องมี** — ปุ่มของจริงอยู่บน `main` เท่านั้น ⇒ ไม่มีตัวนี้ ครั้งแรกที่กดคือ**กดแบบหลับตา**
# ⇒ ตัวนี้ ⛔ ไม่แตะกุญแจเลยสักบรรทัด ⇒ ปล่อยให้วิ่งทุกสาขาและทุกคำขอรวมได้อย่างปลอดภัย
#
# ⛔ ต่างจาก job `สร้างเว็บ` ตรงฐานของเว็บ — ตัวนั้นใช้ฐานปริยาย `/phrakham/` ของที่ทดลอง
#    ส่วนตัวนี้ใช้ฐานของ**ที่อยู่จริง** ⇒ คนละที่อยู่ ⇒ ต้องสร้างคนละรอบ
# ---------------------------------------------------------------------------
ซ้อมปล่อยเว็บ:
  stage: ตรวจ
  <<: [*node, *everywhere, *lfs_data]
  # ⭐ ซองพจนานุกรมขาดไม่ได้ (ใบงาน #103) ⇒ ตัวตั้งค่าเว็บตายถ้าไม่มี ⇒ เหตุผลอยู่ที่ `nuxt.config.ts`
  #   ⭐ ซองคำเน้นก็เช่นกัน (ใบงาน #111) ⇒ ซองฉบับเพิ่มก็เช่นกัน (ใบงาน #169)
  needs: ['พ่นรายการเสียง', 'พ่นพจนานุกรม', 'พ่นคำเน้น', 'พ่นฉบับเพิ่ม']
  script:
    - *pull_audio
    - npm ci --cache .npm --prefer-offline --ignore-scripts
    - sh tools/สร้างเว็บที่จะปล่อย.sh
    - echo "⇒ ซ้อมเท่านั้น ⛔ ยังไม่ส่งขึ้นจริง · ของจริงกดที่ job ปล่อยเว็บ บน main"

# ---------------------------------------------------------------------------
# ⭐ ของจริง — **ต้องมีคนกด** ⇒ นี่คือด่านของกฎ "ห้ามเผยแพร่เว็บเอง"
#   อยู่ stage `deploy` ⇒ ด่านทุกด่านใน stage `ตรวจ` ต้องวิ่งจบก่อน ปุ่มถึงจะกดได้
#
# ⭐ `allow_failure: false` ⛔ ไม่ใช่ของแถม — job แบบ `manual` ของ GitLab **ตั้งต้นเป็นล้มได้**
#   ⇒ ไม่เขียนบรรทัดนี้ = ส่งของไม่สำเร็จแล้วท่อยังเขียว ⇒ คนกดนึกว่าเว็บเปลี่ยนแล้ว
#   **วิธีดูของจริง** ⇒ กดแล้วดูสีของ job นี้ในหน้าท่อ
#
# ⏸ **ตัวแปรที่ต้องตั้งก่อนกดครั้งแรก** (Settings › CI/CD › Variables)
#   `GITHUB_TOKEN_PHRAKHAM` (Masked + Protected) · `PUBLISH_REPO` · `PUBLISH_BRANCH`
#   ⇒ ขาดตัวไหน `tools/ส่งเว็บขึ้น-github.sh` บอกชื่อตัวนั้นแล้วหยุด ⛔ ไม่ส่งของครึ่ง ๆ กลาง ๆ
# ---------------------------------------------------------------------------
# ⛔⛔ **ปุ่มนี้ก็คือการวางเว็บ** ⇒ จึงใช้กฎเดียวกับ `pages` ⇒ `changes: *ui_paths` ตัวเดียวกัน
#   ⇒ ⭐ **ปุ่มโผล่เฉพาะท่อที่ด่านหน้าจอวิ่งครบ** ⇒ ท่อของคอมมิตเอกสารล้วน **⛔ ไม่มีปุ่มให้กด**
#   ⇒ ⛔ **ปุ่มที่กดได้ในท่อที่ด่านถูกข้าม = ของที่ยังไม่ถูกตรวจออกสู่ผู้อ่านจริงที่ phrakham.life**
#     ⇒ แพงกว่าที่ทดลองหลายเท่า เพราะที่นั่น ⛔ ไม่ใช่ของทดลอง
#   ⇒ **อยากปล่อยทั้งที่รอบล่าสุดแตะแต่เอกสาร** ⇒ ปุ่มของท่อก่อนหน้าที่ด่านครบ **ยังกดได้อยู่**
#     หรือสั่งท่อเองจากหน้า Pipelines แล้วรอด่านครบรอบใหม่
ปล่อยเว็บ:
  stage: deploy
  <<: [*node, *lfs_data]
  rules:
    # ⛔ เหตุผลของบรรทัด `parent_pipeline` อยู่ที่ก้อน `.กฎงานที่ปล่อยของออก` ⛔ ไม่จดซ้ำ
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    # ⛔ เหตุผลของ `when: never` บรรทัดนี้ อยู่ที่งาน `pages` ข้างบน ⛔ ไม่จดซ้ำ
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *ui_paths
      when: manual
      allow_failure: false
  script:
    # git ใช้ดันของขึ้น · curl ใช้ปลุกให้ GitHub สร้างเว็บใหม่ (เหตุผลอยู่ใน tools/ส่งเว็บขึ้น-github.sh)
    - apk add --no-cache git curl
    - *pull_audio
    - npm ci --cache .npm --prefer-offline --ignore-scripts
    # ⭐ สร้างใหม่แล้วตรวจ**ชิ้นที่กำลังจะส่ง** ⛔ ไม่ใช่เชื่อว่า job ซ้อมตรวจให้แล้ว
    #   job นั้นสร้างของมันเอง คนละรอบ คนละเวลา ⇒ **คนละชิ้น**
    - sh tools/สร้างเว็บที่จะปล่อย.sh
    - sh tools/ส่งเว็บขึ้น-github.sh

# ---------------------------------------------------------------------------
# ⭐⭐ **งานตัวสุดท้ายของท่อ — ถามเซิร์ฟเวอร์ว่า *ของรอบนี้ขึ้นเว็บจริงไหม***
#   ⇒ **งาน `pages` เขียว ⛔ ไม่ได้แปลว่าเว็บขึ้น** ⇒ ขั้นวางของกิตแล็บเอง (`pages:deploy`)
#     เป็น `GenericCommitStatus` ⇒ ⛔ ไม่โผล่ในรายการ job เลย ⇒ **แดงอยู่ 19 ท่อโดย ⛔ ไม่มีใครเห็น**
#   ⇒ **เหตุผล กติกา และวิธีถาม อยู่ที่หัวไฟล์ `tools/ด่านเว็บขึ้นจริง.py`** ⛔ ไม่จดซ้ำที่นี่
#
# ⛔⛔ **ต้องใช้ `needs: ['pages']` ⛔ ไม่ใช่ปล่อยให้รอทั้ง stage `deploy`**
#   ⇒ stage นั้นมีปุ่ม `ปล่อยเว็บ` ที่เป็น `manual` + `allow_failure: false` ⇒ **มันบล็อก stage ถัดไปไว้**
#   ⇒ ⛔ ไม่ใส่ `needs` = ด่านนี้จะนั่งรอคนมากดปุ่มตลอดกาล ⇒ **ของที่ ⛔ ไม่เคยวิ่ง ⛔ ไม่ใช่ด่าน**
#
# ⭐ **กฎต้องเป็นชุดเดียวกับ `pages` เป๊ะ ๆ** ⇒ จึงใช้ `*deploy_rules` ตัวเดียวกัน
#   ⇒ ⛔⛔ **เขียนกฎแยกเมื่อไร วันที่กฎสองฝั่งไม่ตรงกัน `needs` จะชี้ไปที่งานที่ ⛔ ไม่มีอยู่**
#     ⇒ **ท่อนั้นจะเกิดขึ้นมาโดยมี 0 งาน แล้วแดงทันที** (เจอมาแล้วที่ท่อ 11351 ของกิ่งนี้)
# ---------------------------------------------------------------------------
# ⏸⏸⏸ **ด่านตัวจริงยัง ⛔ ไม่ได้เปิด เพราะกุญแจอ่าน ⛔ ไม่ได้** ⇒ **รอเจ้าของงานตัดสิน**
#
# **ของจริงที่วัดมาแล้ว 20 ต.ค. 2569** ⇒ งาน `ทดลอง-กุญแจงานอ่านสถานะ` (งานที่ 54023 · ท่อ 11354)
#   ⇒ ยิง `GET /api/v4/projects/58/repository/commits/<sha>/statuses` จากในท่อ
#   ⇒ หัว `JOB-TOKEN: $CI_JOB_TOKEN` ⇒ **401** ⇒ `{"message":"401 Unauthorized"}`
#   ⇒ หัว `PRIVATE-TOKEN: $CI_JOB_TOKEN` ⇒ **401** เหมือนกัน
#   ⇒ ⭐ **แปลว่ากุญแจที่กิตแล็บแจกให้ทุกงาน อ่านรายการสถานะของคอมมิต ⛔ ไม่ได้**
#
# ⛔ **จึง ⛔ ไม่เปิดงานตัวจริงไว้** — เปิดทิ้งไว้ = **ท่อของ `main` แดงทุกรอบที่วางเว็บ**
#   ⛔ และ ⛔ **ไม่ตั้งตัวแปรกุญแจเอง** ⇒ ใบสั่งห้ามไว้ตรง ๆ ⇒ **เป็นเรื่องที่ต้องเคาะก่อน**
#   ⛔ และ ⛔ **ไม่ใส่ `allow_failure` เพื่อให้มันเขียว** ⇒ ด่านที่แดงไม่เป็นก็ ⛔ ไม่ใช่ด่าน
#
# ⭐ **ของพร้อมหมดแล้ว เหลือแค่กุญแจ** ⇒ `tools/ด่านเว็บขึ้นจริง.py` เขียนเสร็จและ
#   `ด่านเว็บขึ้นจริงยังจับได้` ข้างล่างพิสูจน์แล้วว่ามันจับของที่ ⛔ ไม่ขึ้นเว็บได้จริง
#
# **วันที่เคาะเรื่องกุญแจแล้ว ⇒ เปิดด้วยการวางก้อนนี้กลับเข้ามา** (ลบเครื่องหมาย `#` ออก)
#   ⇒ ต้องมีตัวแปรที่อ่าน API ได้อย่างน้อย `read_api` ระดับ Reporter ⇒ ตั้งที่ Settings › CI/CD › Variables
#   ⇒ แล้วให้ `tools/ด่านเว็บขึ้นจริง.py` หยิบตัวแปรนั้นแทน `CI_JOB_TOKEN`
#
# ด่านเว็บขึ้นจริง:
#   stage: ทาน
#   image: python:3.13-alpine
#   <<: *deploy_rules
#   needs: ['pages']
#   script:
#     - python3 tools/ด่านเว็บขึ้นจริง.py

