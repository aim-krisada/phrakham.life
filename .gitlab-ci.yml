# **กติกาที่ใช้ตัดสินว่ากองไหนเข้ารายชื่อ** ⇒ กองนั้นเปลี่ยนแล้ว **ไบต์ที่ผู้อ่านเห็นเปลี่ยนได้ไหม**
#   ⇒ เปลี่ยนได้ = เข้ารายชื่อ · เปลี่ยนไม่ได้ = ⛔ ไม่เข้า
#   `docs/` ⛔ ไม่เข้า เพราะ ⛔ ไม่มีโค้ดตัวไหนอ่านมันตอนสร้างเว็บ
#   **วิธีดูของจริง** ⇒ `grep -rn "docs/" app server nuxt.config.ts content.config.ts`
#     ⇒ ที่เจอเป็นคอมเมนต์ล้วน ⛔ ไม่มีการ import หรือ readFile สักจุด
#     ⭐⭐ **วันที่มีหน้าไหนอ่าน `docs/ข้อมูล/` ต้องเติม `docs/` เข้ารายชื่อนี้ทันที** ⛔ ไม่มีอะไรเตือน
#       ⇒ ไฟล์ `docs/ข้อมูล/เราทำข้อมูลอย่างไร.json` ปั้นไว้ให้ฝั่งออกแบบดึงไปวาด ⇒ วันนั้นมาถึงแน่
#   `.gitlab-ci.yml` เข้ารายชื่อด้วย ⇒ วันที่ใครมาแก้รายชื่อนี้เอง ด่านทุกตัวจะวิ่งให้เห็น
#   `tools/*.sh` เข้าด้วย ⇒ มันคือตัวสร้างกับตัวส่งก้อนที่ผู้อ่านได้จริง
#     ตัวอย่าง `BASE_URL=${PUBLISH_BASE_URL:-/v3/}` ใน `tools/สร้างเว็บที่จะปล่อย.sh`
#     ⇒ ใครแก้ `/v3/` เป็นอย่างอื่น ลิงก์ทุกลิงก์ในก้อนที่ปล่อยเปลี่ยนหมด
#   `.gitattributes` กับ `.lfsconfig` เข้าด้วย ⇒ สองไฟล์นี้ตัดสินว่า `_data/` มาถึงเป็นไบต์จริง
#     หรือมาเป็นตัวชี้ของ LFS ⇒ ตัดสินว่าเว็บมีบท หรือ ⛔ ไม่มีบทสักบท
#   `tools/*.py` ⛔ ไม่เข้า เพราะผลของมันทุกตัวเป็น **ไฟล์ที่คอมมิตลงที่เก็บ**
#     ⇒ แก้ตัวปั้นเฉย ๆ โดยไฟล์ผลไม่ขยับ ไบต์ที่ผู้อ่านเห็นก็ ⛔ ไม่ขยับ
#     ⛔ **ผลไม่ได้ลง `_data/` ที่เดียว** ⇒ `tools/สัญญาอนุญาต.py` ลง `public/` (ตัวแปร `ทาง`)
#       และ `tools/สร้างเราทำข้อมูลอย่างไร.py` ลง `docs/` (ตัวแปร `ไฟล์ผล`)
#     `_data/` กับ `public/` อยู่ในรายชื่อแล้ว ส่วน `docs/` ดูย่อหน้าข้างบน
#     ⇒ วันหลังเพิ่มตัวปั้นใหม่ ให้ดูที่ **ไฟล์ผล** ว่าอยู่ในรายชื่อไหม ⛔ ไม่ใช่ดูที่ตัวปั้น
