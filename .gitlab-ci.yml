# ⭐ **ที่ตัดสินจริงคือท่อของคำขอรวม** ⇒ มันเทียบกับ `main` ทั้งสาขา ⛔ ไม่ใช่เทียบกับคอมมิตก่อนหน้า
#   ⇒ แตะหน้าจอไว้คอมมิตแรก แล้วคอมมิตหลังแก้แต่เอกสาร ท่อของคำขอรวมก็ยังเห็นว่าแตะหน้าจอ
