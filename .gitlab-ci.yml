# ⭐ **บรรทัดแรกกับบรรทัด `parent_pipeline`** ⇒ เหตุผลเดียวกับก้อน `.ทุกที่` ข้างบน (ใบงาน #123 ทาง ข)
#   ⇒ ในท่อลูก `changes` เทียบกับคอมมิตก่อนหน้าของ main ชุดเดียวกับท่อแม่
#     ⇒ ถ้ากิตแล็บตอบไม่ได้ว่าอะไรเปลี่ยน มันถือว่า **เปลี่ยน** ⇒ ด่านเบราว์เซอร์วิ่งเพิ่ม ⛔ ไม่มีทางวิ่งน้อยลง
.แตะของที่ทำให้หน้าเปลี่ยน: &ui_changed
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &ui_paths
        - app/**/*            # โค้ดหน้าจอทั้งหมด
        - content/**/*        # ไฟล์ .md ที่กลายเป็นหน้าเว็บ
        - public/**/*         # ไฟล์ที่เสิร์ฟตรง ๆ เช่นฟอนต์กับภาพ
        - server/**/*         # โค้ดที่ป้อนเนื้อให้หน้า
        - _data/**/*          # ซองตัวบท ⇒ ด่านหลายตัวเทียบเนื้อกับกองนี้
        # ⭐⭐ **กองไฟล์เสียง** (ใบงาน v3/phrakham#100) ⇒ เข้ารายชื่อตามกติกาที่เขียนไว้ข้างบน
        #   ⇒ *กองนั้นเปลี่ยนแล้ว **ไบต์ที่ผู้อ่านเห็นเปลี่ยนได้ไหม*** ⇒ **เปลี่ยนได้**
        #     ⇒ `nitro.publicAssets` คัดลอกกองนี้เข้าเว็บตรง ๆ ⇒ มันคือไบต์ที่ผู้อ่านได้ยิน
        #   ⇒ และ `เสียง/ที่มา/` ตัดสินว่า `tools/สร้างรายการเสียง.py` พ่นรายการออกมาเป็นอะไร
        #   ⛔ **ไม่เข้ารายชื่อ = วันหนึ่งเปลี่ยนไฟล์เสียงแล้วด่านหน้าจอ ⛔ ไม่วิ่ง และเว็บ ⛔ ไม่ถูกวาง**
        - เสียง/**/*
        # ⭐⭐ **เรื่องเล่าที่อนุมัติ** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/105) ⇒ เข้ารายชื่อตามกติกาข้างบน
        #   ⇒ ตัวสร้างเว็บอ่านกองนี้ตรง ๆ (`server/utils/เรื่องเล่า.ts`) ⇒ **มันคือตัวหนังสือที่ผู้อ่านเห็น**
        - เรื่องเล่า/**/*
        # ⭐⭐ **พจนานุกรมของการ์ดความหมายคำ** (ใบงาน v3/phrakham#103) ⇒ เข้ารายชื่อตามกติกาข้างบน
        #   ⇒ ของพวกนี้ **⛔ ไม่ได้คอมมิตผล** ⇒ งาน `พ่นพจนานุกรม` พ่นสดจาก zip ทุกท่อ
        #   ⇒ แก้ตัวพ่นหรือเปลี่ยน zip = **ตัวหนังสือบนการ์ดเปลี่ยน** ⇒ ด่านหน้าจอต้องวิ่ง เว็บต้องถูกวางใหม่
        #   ⛔ **ต่างจาก `tools/*.py` ตัวอื่น** ที่ผลลง `_data/` ซึ่งอยู่ในรายชื่ออยู่แล้ว (ดูหัวข้อข้างบน)
        - tools/สร้างพจนานุกรม.py
        - source/strongs-dictionary-xml-master.zip
        - source/HebrewLexicon-master.zip
        - source/Abbott-Smith-master.zip
        # ⭐⭐ **คำเน้นจาก Levinsohn** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/111) ⇒ เหตุผลเดียวกับพจนานุกรมข้างบน
        #   ⇒ งาน `พ่นคำเน้น` พ่นสดจาก zip ทุกท่อ ⇒ แก้ตัวพ่น บัญชีคำที่จับไม่ได้ หรือเปลี่ยน zip = **เครื่องหมายบนคอลัมน์กรีกเปลี่ยน** (ใบ #146 ครบ 33 ชนิด)
        - tools/สร้างคำเน้น.py
        - tools/คำเน้นที่ไม่ลงคำ.json
        - source/levinsohn-master.zip
        # ⭐⭐ **ฉบับเพิ่ม KJV** (ใบงาน https://aimgit.aimagin.com/v3/phrakham/-/issues/169) ⇒ เหตุผลเดียวกับพจนานุกรมข้างบน
        #   ⇒ งาน `พ่นฉบับเพิ่ม` พ่นสดจาก zip ทุกท่อ ⇒ แก้ตัวพ่น เปลี่ยน zip หรือแก้ชื่อฉบับกับเลขที่ตรึงใน `สร้างข้อมูลเว็บ.py`
        #     = **ตัวบทหรือชื่อฉบับบนหน้าอ่านเปลี่ยน**
        - tools/สร้างฉบับเพิ่ม.py
        - tools/สร้างข้อมูลเว็บ.py
        - source/eng-kjv2006_usfx.zip
        - nuxt.config.ts
        - content.config.ts
        - components.json
        - tsconfig.json
        - package.json
        - package-lock.json
        - tools/*.mjs         # ตัวด่านเอง กับตัวเสิร์ฟเว็บที่ด่านใช้
        - tools/*.sh          # ตัวสร้างกับตัวส่งก้อนที่ผู้อ่านได้จริงที่ phrakham.life/v3/
        - .gitattributes      # ⇒ ตัดสินว่า `_data/` มาเป็นไบต์จริง หรือมาเป็นตัวชี้ของ LFS
        - .lfsconfig          # ⇒ ตัดสินว่าไปหยิบไบต์จริงของ LFS จากที่ไหน
        - .gitlab-ci.yml      # แก้รายชื่อนี้เมื่อไร ด่านต้องวิ่งให้เห็น
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      changes: *ui_paths
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      changes: *ui_paths

# ---------------------------------------------------------------------------
# ⭐⭐ **กฎของงานที่ "ปล่อยของออก" ⇒ เขียนไว้ที่เดียว แล้วทุกตัวหยิบไปใช้**
#   ⇒ เหตุผลเต็มอยู่เหนือ job `pages` หัวข้อ *งานวางเว็บทุกตัวต้องใช้กฎเดียวกับด่านหน้าจอ*
#   ⇒ ⛔ **ห้ามให้งานวางเว็บตัวไหนเขียนกฎของตัวเอง** ⇒ เขียนแยกเมื่อไร มันจะเลื่อนออกจากกันวันใดวันหนึ่ง
#   ⇒ `ปล่อยเว็บ` เป็นตัวเดียวที่เขียนเอง เพราะต้องเติม `when: manual` เข้าไปในกฎข้อเดียวกัน
# ---------------------------------------------------------------------------
#   ⇒ ⭐ บรรทัด `parent_pipeline` (ใบงาน #123 ทาง ข) ⇒ ท่อลูกแบบตรวจเต็มคือไฟล์นี้ทั้งไฟล์ ⇒ ⛔ ไม่มีบรรทัดนี้
#     งานวางเว็บจะโผล่ในท่อลูกด้วย ⇒ วางเว็บ 2 รอบต่อคอมมิตเดียว ⇒ และปุ่ม `ปล่อยเว็บ` ขึ้น 2 ปุ่ม
.กฎงานที่ปล่อยของออก: &deploy_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *ui_paths

# ---------------------------------------------------------------------------
# สร้างเว็บครั้งเดียว แล้วให้ 3 ด่านที่ต้องใช้เบราว์เซอร์มาหยิบไปใช้
# ⇒ ตรวจ **ของที่สร้างเสร็จ** ⛔ ไม่ใช่เซิร์ฟเวอร์ตอนพัฒนา
# ⛔ ที่นี่สร้างด้วยฐานปริยาย `/phrakham/` ที่ `nuxt.config.ts` ตั้งไว้
#    ส่วน job `pages` ดึงฐานจาก $CI_PAGES_URL เอง ⇒ ย้ายโฮสต์แล้วยังถูก
# ---------------------------------------------------------------------------
สร้างเว็บ:
  stage: สร้าง
  <<: [*node, *everywhere, *lfs_data]
  # ⭐ รอซองที่งานพ่นทั้งสองตัวพ่นไว้ ⇒ หน้าอ่านต้องใช้ตอนสร้างหน้า
  #   ⛔ **ขาดซองรอยย่อหน้า = ตัวเลือก *แยกตามย่อหน้า* ไม่มีรอยให้ใช้** ⇒ หน้ายังขึ้นแต่ไม่มีย่อหน้า
  #     ⇒ `tools/ด่านย่อหน้าบนหน้า.mjs` จับข้อนี้ได้เอง ⇒ แต่รอไว้ตรงนี้จะ **ตายตั้งแต่ต้นทาง**
  #   ⭐ และรอรายการเสียงด้วย (ใบงาน #100 · #101) ⇒ ข้อมูลประจำเล่มฝังดัชนีเสียงไว้ตอนสร้างหน้า
  #     ⛔ ขาดไป = หน้าอ่าน ⛔ ไม่มีปุ่มเล่นสักเล่ม ⇒ `tools/ด่านฟังพระคำบนหน้า.mjs` ข้อ ② แดง
  #     ⇒ เหตุผลว่าทำไมไม่ล้มตอนสร้าง อยู่ที่ `server/utils/เสียงของเล่ม.ts`
  #   ⭐ และรอซองพจนานุกรม (ใบงาน #103) ⇒ ⛔ ขาดไป = ตัวตั้งค่าเว็บตายพร้อมบอกคำสั่ง ⇒ ตั้งใจให้ตาย
  #     ⇒ ดีกว่าสร้างเว็บที่กดคำแล้วการ์ดว่าง ⇒ เหตุผลอยู่ที่ `nuxt.config.ts` เหนือ `ทางกองพจนานุกรม`
  #   ⭐ และรอซองคำเน้น (ใบงาน #111) ⇒ ⛔ ขาดไป = ตัวตั้งค่าเว็บตายพร้อมบอกคำสั่ง ⇒ เหตุผลเดียวกับซองพจนานุกรม
  #   ⭐ และรอซองฉบับเพิ่ม (ใบงาน #169 ⇒ KJV) ⇒ ⛔ ขาดไป = ตัวตั้งค่าเว็บตายพร้อมบอกคำสั่ง ⇒ เหตุผลอยู่ที่ `แกะซองรวมฉบับเพิ่ม`
  needs: ['พ่นคำพระเยซู', 'พ่นรอยย่อหน้า', 'พ่นรายการเสียง', 'พ่นพจนานุกรม', 'พ่นคำเน้น', 'พ่นฉบับเพิ่ม']
  # ⭐ **งานเดียวที่อัปแคช npm กลับ** ⇒ เหตุผลอยู่เหนือก้อน `.node` (ใบงาน #123 ทาง ก)
  cache:
    <<: *npm_cache
    policy: pull-push
  script:
    - *pull_audio
    - npm ci --cache .npm --prefer-offline --ignore-scripts
    - npm run generate
    # ⛔ สร้างผ่านแต่ไม่มีหน้าเนื้อ = ของที่ด่านทุกตัวจะตรวจแล้วบอกว่าผ่าน โดยไม่มีอะไรให้ตรวจ
    - test -s ".output/public/sources/index.html" || (echo "⛔ ไม่มีหน้าแหล่งข้อมูลที่สร้างเสร็จ" && exit 1)
    # ⭐ หน้าเกี่ยวกับเรา (ใบ https://aimgit.aimagin.com/v3/phrakham/-/issues/172) ⇒ เมนู *เกี่ยวกับเรา* ชี้มาที่นี่ ⇒ ⛔ ไม่มี = เมนูพาไป 404
    - test -s ".output/public/about/index.html" || (echo "⛔ ไม่มีหน้าเกี่ยวกับเราที่สร้างเสร็จ" && exit 1)
    # ⭐ หน้าเล่าประสบการณ์ (ใบ https://aimgit.aimagin.com/v3/phrakham/-/issues/177) ⇒ เมนู *เล่าประสบการณ์* ชี้มาที่นี่ ⇒ ⛔ ไม่มี = เมนูพาไป 404
    - test -s ".output/public/reflections/index.html" || (echo "⛔ ไม่มีหน้าเล่าประสบการณ์ที่สร้างเสร็จ" && exit 1)
    - test -s .output/public/index.html || (echo "⛔ ไม่มีไฟล์ที่รากของเว็บ" && exit 1)
    # หน้าอ่านพระคัมภีร์ (ใบงาน #24) — ของหลักที่ผู้อ่านมาหา
    - test -s ".output/public/read/index.html" || (echo "⛔ ไม่มีหน้าสารบัญพระคัมภีร์" && exit 1)
    # ⭐⭐ **1 เล่ม = 1 หน้า** (ใบงาน v3/phrakham#73) ⇒ จำนวนเล่ม **อ่านจากซองตัวบทเอง**
    #   ⛔ ไม่พิมพ์เลข 66 ไว้ที่นี่ให้ค้างรุ่นเก่า
    # ⭐ **และต้อง ⛔ ไม่มีหน้าของบทเหลืออยู่เลย** ⇒ มีเมื่อไรแปลว่ากลับไป 1 บท 1 หน้าอีกแล้ว
    - |
      WANT=$(node --input-type=module -e \
        'import {แกะซองเนื้อบท} from "./server/utils/ซองเนื้อบท.mjs"
         const บท = Object.keys(แกะซองเนื้อบท("_data/เนื้อบท.json.gz").บท)
         console.log(new Set(บท.map((k) => k.split("/")[0])).size)')
      GOT=$(find .output/public/read -mindepth 2 -maxdepth 2 -name index.html | wc -l)
      echo "หน้าเล่มที่สร้างได้ $GOT ⇒ ในซองตัวบทมี $WANT เล่ม"
      [ "$GOT" -eq "$WANT" ] || { echo "⛔ หน้าเล่มไม่ครบ"; exit 1; }
      DEEP=$(find .output/public/read -mindepth 3 -name index.html | wc -l)
      [ "$DEEP" -eq 0 ] || { echo "⛔ ยังมีหน้าของบทอยู่ $DEEP หน้า ⇒ ต้องเป็นหน้าของเล่มเท่านั้น"; exit 1; }
    # ⭐ ที่วางเว็บนิ่งส่ง `404.html` ให้เมื่อไม่มีไฟล์ ⇒ นี่คือทางที่ที่อยู่เดิมยังเปิดได้
    - test -s .output/public/404.html || (echo "⛔ ไม่มี 404.html ⇒ ที่อยู่เดิมจะตาย" && exit 1)
    # ⭐ **ตัวประทับต้องมีเวลาของคอมมิต = `CI_COMMIT_TIMESTAMP` ตรงตัว** (ใบงาน #101 ข้อ 17)
    #   ⇒ ⛔ ไม่ใช่เวลาที่ท่อสร้างเว็บ ⇒ ตรวจที่นี่ด้วยเพราะงานนี้วิ่งทุกท่อ ⇒ งาน `pages` วิ่งแค่บน main
    - grep -o "datetime=\"$CI_COMMIT_TIMESTAMP\"[^<]*" ".output/public/sources/index.html" || (echo "⛔ ตัวประทับ ⛔ ไม่มีเวลาของคอมมิต $CI_COMMIT_TIMESTAMP" && exit 1)
    # ⭐ **หน้า `/listen` ต้องไม่ถูกสร้างแล้ว** (ใบงาน #101 ข้อ 16) ⇒ พี่เอมเคาะ *"ตัด ไม่เคยใช้จริง"*
    - test ! -e .output/public/listen || (echo "⛔ ยังมีหน้า /listen ⇒ ต้องถอดออกแล้ว" && exit 1)
  artifacts:
    paths:
      - .output/public
    expire_in: 1 day

# ---------------------------------------------------------------------------
# ด่าน ① — คำสั่งที่เอกสารบอกให้คนไปรัน ต้องรันออกจริง (ใบงาน v3/phrakham#11)
# ⛔ อยู่ stage ก่อน deploy ⇒ ด่านแดงแล้วเว็บที่ทดลองไม่ขึ้น
# เหตุผลของกติกาทุกข้อ อยู่ที่หัวไฟล์ tools/ด่านคำสั่งเอกสาร.py
# ---------------------------------------------------------------------------
ด่านคำสั่งเอกสาร:
  stage: ตรวจ
  image: python:3.13-alpine
  # ⛔ **ต้องมี `rules` ด้วย** — job ที่ ⛔ ไม่มี `rules` จะ **ไม่ถูกใส่ลงท่อของคำขอรวมเลย**
  #   ⇒ คนตรวจเปิดคำขอรวมแล้วเห็นเครื่องหมายเขียว ทั้งที่ด่านนี้ ⛔ ไม่เคยวิ่งในท่อนั้น
  #   (เห็นเองที่ท่อ 8747 เทียบกับ 8745 · 29 ส.ค. 2569)
  <<: *everywhere
  needs: []
  script:
    - apk add --no-cache git >/dev/null
    - python3 tools/ด่านคำสั่งเอกสาร.py

# ---------------------------------------------------------------------------
# ด่าน ② — ห้ามมีข้อความซ้ำกับที่เก็บของกลาง v3/way (ใบงาน v3/phrakham#11)
# กติกาทุกข้อกับที่มาของเพดาน 30 ตัวอักษร อยู่ที่หัวไฟล์ tools/ด่านข้อความซ้ำ.py
# ---------------------------------------------------------------------------
ด่านข้อความซ้ำ:
  stage: ตรวจ
  image: python:3.13-alpine
  <<: *everywhere
  needs: []
  script:
    # ⭐⭐ **อ่านลายนิ้วมือของ v3/way ⛔ ไม่โคลนตัวจริง** (พี่เอมเคาะ 19 พ.ย. 2569)
    #   ⇒ ที่เก็บนี้ขึ้น GitHub แบบสาธารณะ ⇒ v3/way มีข้อมูลเครื่องภายในบริษัท ⇒ เนื้อจริงขึ้นไป ⛔ ไม่ได้
    #   ⇒ ลายนิ้วมือย้อนกลับเป็นข้อความ ⛔ ไม่ได้ แต่จับท่อนซ้ำได้เท่าเดิม ⇒ เหตุผลเต็มอยู่ใน tools/ด่านข้อความซ้ำ.py
    #   ⇒ v3/way เปลี่ยนเมื่อไร ⇒ สร้างลายใหม่ด้วย `--way <โฟลเดอร์ของ way> --สร้างลายนิ้วมือ tools/ลายนิ้วมือ-way.json.gz`
    - python3 tools/ด่านข้อความซ้ำ.py --way tools/ลายนิ้วมือ-way.json.gz

# ---------------------------------------------------------------------------
# ด่าน ⑥ — ข้อมูลที่เจ้าของไม่ให้เผยแพร่ ต้องไม่หลุดออกมา (ใบงาน v3/phrakham#23)
#
# ⛔ **ที่นี่รันได้แค่ท่าพิสูจน์แดง-เขียว ⛔ ไม่ใช่การตรวจของจริง**
#   การตรวจของจริงต้องมีกอง `_แตก` 4.8 GiB กับผลลัพธ์ที่แปลงแล้ว ⇒ ตัวรันของอัมกิตไม่มีทั้งคู่
#   ⇒ ⭐ **แต่ท่าพิสูจน์มีค่าที่สุด** — มันตอบว่า **ด่านยังจับของผิดได้อยู่ไหม**
#     ⇒ วันที่ใครแก้ด่านจนมันเขียวตลอด ท่อนี้จะแดงทันที
#
# ⛔ `allow_failure` ⛔ ไม่ใส่ — ข้อมูลที่หลุดออกไปแล้วเอากลับไม่ได้
# ---------------------------------------------------------------------------
ด่านข้อมูลต้องห้าม:
  stage: ตรวจ
  image: python:3.13-alpine
  <<: *everywhere
  needs: []
  script:
    - python3 tools/ด่านข้อมูลต้องห้าม.py --ทดสอบตัวเอง

# ---------------------------------------------------------------------------
# ด่าน ⑥ ท่อนที่สอง — **ตรวจของจริงที่จะขึ้นเว็บ** (ใบงาน v3/phrakham#69)
#
# ⭐⭐ **ตรงนี้ต่างจาก job ข้างบน** — ข้างบนพิสูจน์ว่า *ด่านยังจับของผิดได้อยู่ไหม*
#   ส่วนตรงนี้ตรวจ **ไบต์จริงที่คอมมิตไว้ใน `_data/`** ⇒ ของที่จะออกไปถึงผู้อ่านจริง ๆ
#   ⇒ ⭐ ทำได้เพราะ `_data/` อยู่ในกิตแล้ว ⛔ ไม่ต้องมีกอง `_แตก` 4.8 GiB
#
# ⛔ `allow_failure` ⛔ ไม่ใส่ — ข้อมูลที่หลุดออกไปแล้วเอากลับไม่ได้
# ---------------------------------------------------------------------------
ด่านข้อมูลต้องห้ามในของจริง:
  stage: ตรวจ
  image: python:3.13-alpine
  <<: [*everywhere, *lfs_data]
  needs: []
  script:
    # ⛔ ไม่ต้อง apk add git-lfs — ตัวรันของอัมกิตดึงโค้ดด้วยภาพช่วยของมันเอง ⛔ ไม่ใช่ภาพของ job นี้
    # ⭐ **ได้ไบต์จริง ⛔ ไม่ใช่ตัวชี้ — ด่านเองเป็นคนพิสูจน์** ⇒ เจอตัวชี้เมื่อไรมันหยุดแล้วบอกทันที
    #   ⛔ **ห้ามไปหาบรรทัด `Downloading _data/…` ใน log** ⇒ ตัวรันตัวนี้ดึง LFS แบบเงียบ
    #   ⇒ ไม่มีบรรทัดนั้นให้เห็นเลย (เปิดดู log ของ job 44101 เองแล้ว 6 ก.ย. 2569)
    # ⭐ `docs` อยู่ด้วย — ไฟล์อย่าง `docs/ข้อมูล/เราทำข้อมูลอย่างไร.json` ปั้นไว้ให้หน้าเว็บดึงไปวาด
