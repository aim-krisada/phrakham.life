    - name: แกะชิ้นงานของ พ่นพจนานุกรม ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j02b428e908/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นคำเน้น
