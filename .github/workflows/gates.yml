    - name: แกะชิ้นงานของ พ่นคำเน้น ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j846a7c4138/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นฉบับเพิ่ม
      uses: actions/download-artifact@v4
      with:
        name: a-j7d185e7f96
        path: /tmp/ชิ้นงาน/j7d185e7f96
    - name: แกะชิ้นงานของ พ่นฉบับเพิ่ม ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j7d185e7f96/ชิ้นงาน.tar"
    - name: สร้างเว็บ
      env:
        JOB_SCRIPT: |
          set -e
          (set -o pipefail) 2>/dev/null && set -o pipefail
          SKIP_AUDIO=0
          if [ -s _พ่น/รายการเสียง.json ] && grep -q '"ฐานของฉบับ":{"' _พ่น/รายการเสียง.json; then
            SKIP_AUDIO=1
            echo "⏭ เสียงอยู่บน GitHub Pages แล้ว ⇒ ⛔ ไม่ดึงไบต์จริงของ เสียง/ ⇒ ตัวสร้างเว็บ ⛔ ไม่คัดลอก mp3"
          fi
          echo "$SKIP_AUDIO" > /tmp/skip_audio

          command -v git-lfs >/dev/null 2>&1 || apk add --no-cache git git-lfs
          if [ "$(cat /tmp/skip_audio)" = 1 ]; then git -c lfs.fetchexclude= lfs pull -I "เสียง/เรื่องเล่า/"; else git -c lfs.fetchexclude= lfs pull -I "เสียง/"; fi
          for f in เสียง/เรื่องเล่า/*.mp3; do
            if head -c 40 "$f" | grep -q "git-lfs"; then
              echo "⛔ $f ยังเป็นตัวชี้ของ Git LFS ⛔ ไม่ใช่ไบต์จริง ⇒ กดฟังเรื่องเล่าแล้วจะเงียบ"
              exit 1
            fi
          done
          echo "✅ ไบต์จริงของเสียงเรื่องเล่าพร้อมแล้ว ⇒ $(du -sh เสียง/เรื่องเล่า | cut -f1)"
          if [ "$(cat /tmp/skip_audio)" = 1 ]; then
            :
          elif head -c 40 "เสียง/ข้อ/Acts.1.1.puck.mp3" | grep -q "git-lfs"; then
            echo "⛔ เสียง/ ยังเป็นตัวชี้ของ Git LFS ⛔ ไม่ใช่ไบต์จริง ⇒ การดึงล้มเหลว"
            exit 1
          fi
          [ "$(cat /tmp/skip_audio)" = 1 ] || echo "✅ ไบต์จริงของเสียงพร้อมแล้ว ⇒ $(du -sh เสียง/ข้อ | cut -f1)"

          npm ci --cache .npm --prefer-offline --ignore-scripts
          npm run generate
          test -s ".output/public/sources/index.html" || (echo "⛔ ไม่มีหน้าแหล่งข้อมูลที่สร้างเสร็จ" && exit 1)
          test -s ".output/public/about/index.html" || (echo "⛔ ไม่มีหน้าเกี่ยวกับเราที่สร้างเสร็จ" && exit 1)
          test -s ".output/public/reflections/index.html" || (echo "⛔ ไม่มีหน้าเล่าประสบการณ์ที่สร้างเสร็จ" && exit 1)
          test -s .output/public/index.html || (echo "⛔ ไม่มีไฟล์ที่รากของเว็บ" && exit 1)
          test -s ".output/public/read/index.html" || (echo "⛔ ไม่มีหน้าสารบัญพระคัมภีร์" && exit 1)
          WANT=$(node --input-type=module -e \
            'import {แกะซองเนื้อบท} from "./server/utils/ซองเนื้อบท.mjs"
             const บท = Object.keys(แกะซองเนื้อบท("_data/เนื้อบท.json.gz").บท)
             console.log(new Set(บท.map((k) => k.split("/")[0])).size)')
          GOT=$(find .output/public/read -mindepth 2 -maxdepth 2 -name index.html | wc -l)
          echo "หน้าเล่มที่สร้างได้ $GOT ⇒ ในซองตัวบทมี $WANT เล่ม"
          [ "$GOT" -eq "$WANT" ] || { echo "⛔ หน้าเล่มไม่ครบ"; exit 1; }
          DEEP=$(find .output/public/read -mindepth 3 -name index.html | wc -l)
          [ "$DEEP" -eq 0 ] || { echo "⛔ ยังมีหน้าของบทอยู่ $DEEP หน้า ⇒ ต้องเป็นหน้าของเล่มเท่านั้น"; exit 1; }

          test -s .output/public/404.html || (echo "⛔ ไม่มี 404.html ⇒ ที่อยู่เดิมจะตาย" && exit 1)
          test -s .output/public/sw.js || (echo "⛔ ไม่มี sw.js ⇒ แอปที่ติดตั้งแล้วอ่านแบบไม่มีเน็ตไม่ได้" && exit 1)
          test -s .output/public/offline.json || (echo "⛔ ไม่มี offline.json ⇒ ตัวช่วยออฟไลน์ไม่รู้ว่าต้องเก็บอะไร" && exit 1)
          grep -o "datetime=\"$CI_COMMIT_TIMESTAMP\"[^<]*" ".output/public/sources/index.html" || (echo "⛔ ตัวประทับ ⛔ ไม่มีเวลาของคอมมิต $CI_COMMIT_TIMESTAMP" && exit 1)
          test ! -e .output/public/listen || (echo "⛔ ยังมีหน้า /listen ⇒ ต้องถอดออกแล้ว" && exit 1)
        JOB_VARS: GIT_LFS_SKIP_SMUDGE
        GIT_LFS_SKIP_SMUDGE: '0'
      run: bash .github/run-job.sh node:24-alpine
    - name: อัดชิ้นงาน
