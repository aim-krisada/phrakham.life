        mkdir -p "$RUNNER_TEMP/ชิ้นงาน"
        sudo tar -cf "$RUNNER_TEMP/ชิ้นงาน/ชิ้นงาน.tar" --ignore-failed-read '.output/public' 2>/dev/null || sudo tar -cf "$RUNNER_TEMP/ชิ้นงาน/ชิ้นงาน.tar" -T /dev/null
