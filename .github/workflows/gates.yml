    - name: แกะชิ้นงานของ พ่นรอยย่อหน้า ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j259ce7680f/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นรายการเสียง
      uses: actions/download-artifact@v4
      with:
        name: a-jb6ea1e5900
        path: /tmp/ชิ้นงาน/jb6ea1e5900
    - name: แกะชิ้นงานของ พ่นรายการเสียง ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/jb6ea1e5900/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นพจนานุกรม
      uses: actions/download-artifact@v4
      with:
        name: a-j02b428e908
