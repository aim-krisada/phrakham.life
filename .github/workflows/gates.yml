    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false
        fetch-depth: 1
      env:
        GIT_LFS_SKIP_SMUDGE: '1'
    - name: เตรียมงาน
      uses: ./.github/actions/prep
      with:
        lfs-key: ${{ needs.lfs.outputs.key }}
        data: '1'
    - name: แคช npm
      uses: actions/cache@v4
      with:
        path: .npm
        key: npm-${{ hashFiles('package-lock.json') }}
    - name: หยิบชิ้นงานของ พ่นคำพระเยซู
      uses: actions/download-artifact@v4
      with:
        name: a-j27854f2a42
        path: /tmp/ชิ้นงาน/j27854f2a42
    - name: แกะชิ้นงานของ พ่นคำพระเยซู ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j27854f2a42/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นเชิงอรรถ
      uses: actions/download-artifact@v4
      with:
        name: a-j90bc49cb5b
        path: /tmp/ชิ้นงาน/j90bc49cb5b
    - name: แกะชิ้นงานของ พ่นเชิงอรรถ ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j90bc49cb5b/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นรอยย่อหน้า
      uses: actions/download-artifact@v4
      with:
        name: a-j259ce7680f
        path: /tmp/ชิ้นงาน/j259ce7680f
    - name: แกะชิ้นงานของ พ่นรอยย่อหน้า ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j259ce7680f/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นรายการเสียง
      uses: actions/download-artifact@v4
      with:
        name: a-jb6ea1e5900
        path: /tmp/ชิ้นงาน/jb6ea1e5900
    - name: แกะชิ้นงานของ พ่นรายการเสียง ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/jb6ea1e5900/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นพจนานุกรม
      uses: actions/download-artifact@v4
      with:
        name: a-j02b428e908
        path: /tmp/ชิ้นงาน/j02b428e908
    - name: แกะชิ้นงานของ พ่นพจนานุกรม ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j02b428e908/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นคำเน้น
      uses: actions/download-artifact@v4
      with:
        name: a-j846a7c4138
        path: /tmp/ชิ้นงาน/j846a7c4138
    - name: แกะชิ้นงานของ พ่นคำเน้น ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j846a7c4138/ชิ้นงาน.tar"
    - name: หยิบชิ้นงานของ พ่นฉบับเพิ่ม
      uses: actions/download-artifact@v4
      with:
        name: a-j7d185e7f96
        path: /tmp/ชิ้นงาน/j7d185e7f96
    - name: แกะชิ้นงานของ พ่นฉบับเพิ่ม ลงที่เดิม
      run: tar -xf "/tmp/ชิ้นงาน/j7d185e7f96/ชิ้นงาน.tar"
    - name: ปล่อยเว็บ
      env:
        JOB_SCRIPT: |
          set -e
          (set -o pipefail) 2>/dev/null && set -o pipefail
          apk add --no-cache git curl
          SKIP_AUDIO=0
          if [ -s _พ่น/รายการเสียง.json ] && grep -q '"ฐานของฉบับ":{"' _พ่น/รายการเสียง.json; then
            SKIP_AUDIO=1
            echo "⏭ เสียงอยู่บน GitHub Pages แล้ว ⇒ ⛔ ไม่ดึงไบต์จริงของ เสียง/ ⇒ ตัวสร้างเว็บ ⛔ ไม่คัดลอก mp3"
          fi
          echo "$SKIP_AUDIO" > /tmp/skip_audio

          command -v git-lfs >/dev/null 2>&1 || apk add --no-cache git git-lfs
          if [ "$(cat /tmp/skip_audio)" = 1 ]; then git -c lfs.fetchexclude= lfs pull -I "เสียง/เรื่องเล่า/"; else git -c lfs.fetchexclude= lfs pull -I "เสียง/"; fi
          for f in เสียง/เรื่องเล่า/*.mp3; do
            if head -c 40 "$f" | grep -q "git-lfs"; then
              echo "⛔ $f ยังเป็นตัวชี้ของ Git LFS ⛔ ไม่ใช่ไบต์จริง ⇒ กดฟังเรื่องเล่าแล้วจะเงียบ"
              exit 1
            fi
          done
          echo "✅ ไบต์จริงของเสียงเรื่องเล่าพร้อมแล้ว ⇒ $(du -sh เสียง/เรื่องเล่า | cut -f1)"
          if [ "$(cat /tmp/skip_audio)" = 1 ]; then
            :
          elif head -c 40 "เสียง/ข้อ/Acts.1.1.puck.mp3" | grep -q "git-lfs"; then
            echo "⛔ เสียง/ ยังเป็นตัวชี้ของ Git LFS ⛔ ไม่ใช่ไบต์จริง ⇒ การดึงล้มเหลว"
            exit 1
          fi
          [ "$(cat /tmp/skip_audio)" = 1 ] || echo "✅ ไบต์จริงของเสียงพร้อมแล้ว ⇒ $(du -sh เสียง/ข้อ | cut -f1)"

          npm ci --cache .npm --prefer-offline --ignore-scripts
          sh tools/สร้างเว็บที่จะปล่อย.sh
          sh tools/ส่งเว็บขึ้น-github.sh
        JOB_VARS: GIT_LFS_SKIP_SMUDGE PUBLISH_REPO PUBLISH_BRANCH PUBLISH_DISPATCH_EVENT GITHUB_TOKEN_PHRAKHAM
        GIT_LFS_SKIP_SMUDGE: '0'
        PUBLISH_REPO: ${{ github.repository }}
        PUBLISH_BRANCH: v3-dist
        PUBLISH_DISPATCH_EVENT: v3-delivered
        GITHUB_TOKEN_PHRAKHAM: ${{ secrets.GITHUB_TOKEN }}
      run: bash .github/run-job.sh node:24-alpine
    if: github.event_name == 'push' && github.ref == 'refs/heads/v3'
    permissions:
      contents: write
    concurrency:
      group: ปล่อยเว็บ-v3
      cancel-in-progress: false
