# ⛔⛔ ไฟล์นี้สร้างด้วยเครื่อง ⇒ ห้ามแก้ด้วยมือ
#   ⇒ แก้ที่ .gitlab-ci.yml แล้วรัน `python tools/สร้างท่อGitHub.py` ⇒ เหตุผลอยู่หัวไฟล์นั้น
#   ⇒ ด่าน 254 งาน จาก .gitlab-ci.yml
name: ตรวจ
'on':
  pull_request:
  push:
    branches:
    - main
    - v3
  workflow_dispatch:
concurrency:
  group: ตรวจ-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  lfs:
    name: เตรียมไฟล์ LFS (ดึงครั้งเดียว แล้วเก็บแคช)
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false
      env:
        GIT_LFS_SKIP_SMUDGE: '1'
    - id: key
      name: ชื่อแคช = ลายของรายการไฟล์ LFS ทั้งหมด
      run: echo "key=lfs-$(git lfs ls-files -l | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: .git/lfs/objects
        key: ${{ steps.key.outputs.key }}
        restore-keys: lfs-
    - if: steps.cache.outputs.cache-hit != 'true'
      name: ดึงเฉพาะไฟล์ LFS ที่แคชยังไม่มี
      run: git -c lfs.fetchexclude= lfs fetch origin HEAD
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .git/lfs/objects
        key: ${{ steps.key.outputs.key }}
  j14dbf6b990:
    name: สร้างเว็บ
    needs:
    - lfs
    - j27854f2a42
    - j90bc49cb5b
    - j259ce7680f
