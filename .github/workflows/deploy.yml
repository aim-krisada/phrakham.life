name: Deploy to GitHub Pages

# TWO VERSIONS, ONE SITE — root is what people read today, and it comes from `main`.
#   /      = branch `main`    — the live site. Quarto built these files elsewhere and they are
#                               committed as finished HTML, so there is NOTHING to build here:
#                               checking `main` out already gives us the site.
#   /v3/   = branch `v3-dist` — the redesign. ⚠️ NOT source: it holds the ALREADY-BUILT site.
#                               May not exist yet; that is fine and must not fail the run.
#                               Delivered by aimgit, which then fires `repository_dispatch` —
#                               see the `on:` block for why a push to that branch cannot do it.
#
# WHY /v3/ IS DELIVERED AND NOT BUILT HERE: v3 is a Nuxt app and it lives on aimgit (project
# `v3/phrakham`), not here. It is built THERE by the manual job `ปล่อยเว็บ` and the finished files
# are pushed to `v3-dist`. This repo only serves them, because a custom domain can be attached to
# exactly one repository and this is that repository.
# ⇒ so there is no `npm ci`/`npm run build` for v3 here. Building it here would mean copying both
#   v3's source AND its data key into this public repo; delivering the built files does not.
#
# The branch name and the dispatch event name below must match the CI variables on aimgit
# (`PUBLISH_BRANCH`, `PUBLISH_DISPATCH_EVENT`) — aimgit's `tools/ส่งเว็บขึ้น-github.sh` owns those.
on:
  push:
    branches: [main]
  # A delivery of v3 arrives as a push to `v3-dist` — but that CANNOT trigger this file, because
  # GitHub reads the workflow from the ref that was pushed, and `v3-dist` holds the built site only:
  # no .github/ at all. Listing it under `push.branches` would therefore be a lie that reads as
  # working, and the delivery would silently show up on the next unrelated push to main instead.
  # ⇒ aimgit calls the repository_dispatch API right after pushing. That always runs the workflow
  #   file on the DEFAULT branch, which is the copy we can actually see and review.
  repository_dispatch:
    types: [v3-delivered]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do NOT cancel an in-progress deploy: a cancelled
# deploy-pages run can leave the Pages backend mid-deployment, and the next push
# then fails with "Deployment failed, try again later." Let production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---- the live site (root) — from `main` --------------------------------------------------
      # NO continue-on-error here on purpose: if the live site cannot be fetched, the run must go
      # red and nothing ships. Shipping a site whose root is missing is worse than not shipping.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live

      # ---- drop what is in the checkout but is not the site ------------------------------------
      # `.claude/worktrees` is AI working copies that were committed here by accident.
      # Two reasons it has to go, not one:
      #   1. it is not the site — and the branch builder we are replacing did not skip it either,
      #      so this is a removal from a live site, not merely a guard against a new one: those
      #      paths turn into 404 the first time this workflow ships, and that is intended.
      #   2. with it the checkout is over the 1 GB a published Pages site may be; without it it
      #      fits. ⛔ No size is written here: what actually goes up is printed every run by the
      #      `du -sh live` line in the report step below, and a size repeated in a comment is a
      #      copy that goes stale without anyone noticing.
      # ⛔ Do not turn this into "delete everything that starts with a dot". `.nojekyll` is a FILE
      #   at the root and it must survive: switching Settings › Pages back to the branch builder is
      #   the rollback for this whole change, and that builder needs `.nojekyll` to serve
      #   `site_libs/` and every other underscore path.
      # The commit is read BEFORE `.git` goes away — that is the only place it can be read from,
      # and the report step at the bottom needs it.
      - id: root
        name: Record the root commit, then remove non-site files from the checkout
        run: |
          echo "sha=$(git -C live rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf live/.git live/.github live/.claude

      # The step above deletes by name, so a typo there would quietly ship the wrong thing.
      # These lines are the proof that it removed what it should and kept what it must. Everything
      # else on the keep-list survives by construction: we copy the checkout and delete three
      # named entries, so nothing can be dropped without changing the line above.
      - name: Check the root still is the site
        run: |
          test -f live/index.html
          test -f live/CNAME
          test -f live/.nojekyll
          for d in .git .github .claude; do
            test ! -e "live/$d" || { echo "::error::live/$d survived the cleanup"; exit 1; }
          done

      # ---- the redesign (/v3/) — already built, delivered on branch `v3-dist` -------------------
      # continue-on-error on the CHECKOUT: `v3-dist` may not exist yet, and a missing branch must
      # not fail the run. No install and no build — the files arrive finished (see header).
      - id: v3checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: v3-dist
          path: v3

      # A delivered site must be able to say which commit it came from, the same way root does.
      # v3's own CI writes version.json; if it is missing, the delivery is not what we expect, so
      # treat it as "no v3 this run" rather than shipping something unidentifiable.
      #
      # WHAT THIS STEP ANSWERS: "did the whole delivery arrive, or only part of it?" ⛔ NOT "does the
      # home page open?" A build that dies half way still writes a perfect home page, so opening one
      # page — or following the links on it — proves nothing about the rest. (On the sister repo
      # pleng.phrakham.life a reviewer deleted the whole _nuxt/ directory from a real build and an
      # earlier version of this check stayed green; on 8 Sep 2026 a reviewer threw away 97% of this
      # delivery, 1543 files down to 52, and the version before this one stayed green too.)
      #
      # HOW COMPLETENESS IS MEASURED WITHOUT NAMING A SINGLE BOOK: the delivery carries three
      # separate listings of the same set of books — one JSON per book under api/book/, one chapter
      # directory per book under api/chapter/, and one reading page per book under read/. A build
      # that stopped part way, or a delivery that lost files on the way here, leaves those three out
      # of step with each other, and they are compared against each other — never against a list
      # written down here. ⛔ Never write a book name, a book count or a page name into this file:
      # aimgit owns those and they do change (a page moved once already, 29 Aug 2026, /sources →
      # /read), and a copy kept here would go stale without anyone noticing.
      #
      # ⚠️ WHAT IT STILL CANNOT SEE: if all three listings shrink by the same books, the delivery is
      # self-consistent and this step is green. Only a count sent by the sender can catch that, and
      # the sender has not been asked for one yet (noted on aimgit issue #89). ⛔ So a green here is
      # still not a promise that the delivery is complete — it is the receiver's shallow second
      # line. The first line is the sender's own: aimgit's tools/สร้างเว็บที่จะปล่อย.sh counts the
      # pages it built against its data before it hands anything over.
      - id: v3check
        if: steps.v3checkout.outcome == 'success'
        continue-on-error: true
        run: |
          test -f v3/index.html
          test -f v3/version.json

          # ---- 1. nothing hollow -----------------------------------------------------------------
          # `test -f` says a file is there, not that anything is inside it. A write that failed part
          # way leaves a 0-byte .js, .css or .html behind, and every check further down still passes
          # while the site is blank in the browser.
          empty=$(find v3 -type f -empty -not -path 'v3/.git/*' | head -3 | tr '\n' ' ')
          test -z "$empty" \
            || { echo "::error::delivered v3 contains empty files, e.g. $empty"; exit 1; }

          # ---- 2. no whole part of the delivery went missing --------------------------------------
          # ⛔ These are the delivery's own directory names, not page names. If aimgit renames one,
          # this step goes red on purpose: the census below reads these directories, so a rename has
          # to be followed here instead of quietly skipped.
          for d in _nuxt __nuxt_content api/book api/chapter read; do
            test -n "$(find "v3/$d" -type f -print -quit 2>/dev/null)" \
              || { echo "::error::v3/$d is missing or holds no files — the delivery is not complete"; exit 1; }
          done
          test -n "$(find v3/_nuxt -name '*.js' -print -quit)" \
            || { echo "::error::delivered v3 has no JS in _nuxt — refusing to publish an empty page"; exit 1; }

          # ---- 3. the census: the three listings of the books must agree --------------------------
          data=$(find v3/api/book -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | sort)
          chapters=$(find v3/api/chapter -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          rendered=$(find v3/read -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          books=$(printf '%s\n' "$data" | grep -c . || true)
          [ "$books" -gt 0 ] \
            || { echo "::error::v3/api/book lists no books at all — the delivery is not complete"; exit 1; }
          gap=$(comm -3 <(printf '%s\n' "$data") <(printf '%s\n' "$chapters") | tr -d '\t' | sort -u | tr '\n' ' ')
          test -z "$gap" \
            || { echo "::error::api/book lists $books books but api/chapter does not match it — out of step: $gap"; exit 1; }
          gap=$(comm -3 <(printf '%s\n' "$data") <(printf '%s\n' "$rendered") | tr -d '\t' | sort -u | tr '\n' ' ')
          test -z "$gap" \
            || { echo "::error::api/book lists $books books but read/ does not match it — out of step: $gap"; exit 1; }
          # Every book must have a page with something on it, and chapter data behind that page.
          # ⚠️ The size floor is deliberately far below any real page (the smallest reading page in a
          # good delivery runs to several kilobytes) and far above an empty shell — it is here to
          # catch a page that was written but never filled, not to police page size.
          for b in $data; do
            p="v3/read/$b/index.html"
            test -f "$p" \
              || { echo "::error::book $b has data but no reading page at /v3/read/$b"; exit 1; }
            [ "$(wc -c <"$p")" -ge 1024 ] \
              || { echo "::error::the reading page for $b is only $(wc -c <"$p") bytes — that is a shell, not a page"; exit 1; }
            test -n "$(find "v3/api/chapter/$b" -name '*.json' -print -quit)" \
              || { echo "::error::book $b has no chapter data under api/chapter/$b"; exit 1; }
          done

          # ---- 4. the home page must lead somewhere -----------------------------------------------
          # The links are read out of the delivered file. ⛔ Do not write a page name here.
          # Every shape the root has had, or could have, is accepted, because all of them work in a
          # browser and none of them may fail here: a real page (href="/v3/read"), the old redirect
          # stub (url=/v3/read), single quotes, and links written relative to the root (href="read").
          # ⚠️ A link back to the home page itself — rel="canonical" href="/v3/", which Nuxt writes on
          # its own, or a stub that redirects to /v3/ — is not a way out and is not counted. A page
          # whose only links point at itself is not a home page.
          linked=
          n=0
          for raw in $(grep -ohE "(href|url)=(\"[^\"]*\"|'[^']*'|[^\"'[:space:]>]+)" v3/index.html \
                       | sed -E "s/^(href|url)=//; s/^[\"']//; s/[\"']\$//" | sort -u); do
            t=${raw%%\?*}; t=${t%%#*}
            case "$t" in ""|"#"*|*:*|"//"*) continue ;; esac
            case "$t" in
              /v3|/v3/*) t=${t#/v3} ;;
              /*) continue ;;
              *) t="/$t" ;;
            esac
            t=$(printf '%b' "${t//%/'\x'}")
            t=${t%/}
            test -n "$t" || continue
            case "${t##*/}" in
              *.js|*.mjs|*.css|*.json|*.map|*.txt|*.xml|*.webmanifest|*.ico|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.avif|*.woff|*.woff2|*.ttf|*.mp3|*.pdf) continue ;;
            esac
            # ⚠️ A page name is allowed to contain a dot — our Bible references are written with one,
            # as in /v3/read/JHN/3.16 — so "has a dot" must never be read as "is a file". Only the
            # file endings listed just above are treated as files.
            page=
            for c in "v3$t/index.html" "v3$t" "v3$t.html"; do
              [ -f "$c" ] && { page="$c"; break; }
            done
            test -n "$page" \
              || { echo "::error::the home page links to /v3$t but that page is not in the delivery"; exit 1; }
            case " $linked " in *" $page "*) continue ;; esac   # two links, one page
            linked="$linked $page"
            n=$((n+1))
          done
          [ "$n" -gt 0 ] \
            || { echo "::error::v3/index.html links to no other page under /v3/ — that is not a home page"; exit 1; }

          # ---- 5. every file the delivered pages name must be there -------------------------------
          # ⚠️ This reads EVERY delivered page, not only the home page and its neighbours. The home
          # page names its own bundle and nothing else, so a delivery that lost most of _nuxt/ would
          # sail through if only the home page were read.
          # ⚠️ Thai file names are percent-encoded inside the HTML but are Thai bytes on disk, so the
          # path has to be decoded before it is tested — comparing the raw text would report every
          # valid Thai-named file as missing. (Same trap aimgit hit on 29 Aug 2026.)
          refs=0
          for p in $(grep -ohrE "[\"']/v3/[^\"']+" --include='*.html' --exclude-dir=.git v3 \
                     | cut -c2- | sort -u); do
            p=${p%%\?*}; p=${p%%#*}
            case "${p##*/}" in
              *.js|*.mjs|*.css|*.json|*.map|*.txt|*.xml|*.webmanifest|*.ico|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.avif|*.woff|*.woff2|*.ttf|*.mp3|*.pdf) ;;
              *) continue ;;
            esac
            p=$(printf '%b' "${p//%/'\x'}")
            test -f "v3${p#/v3}" \
              || { echo "::error::delivered v3 references $p but the file is missing"; exit 1; }
            refs=$((refs+1))
          done

          # ---- 6. the JS bundle must have no holes in it ------------------------------------------
          # ⚠️ A page names only the handful of files it needs to start. The rest of the app is
          # fetched later, by name, from inside the JS — and those names appear nowhere in any HTML,
          # so a delivery that lost them looks perfect to sections 4 and 5 and then breaks under the
          # reader's first click. (8 Sep 2026: a reviewer deleted every _nuxt file the four pages
          # then being read did not name, and the check before this one stayed green.)
          chunks=0
          for c in $(grep -ohE '"\./[A-Za-z0-9_.-]+\.(js|css)"' v3/_nuxt/*.js | tr -d '"' | sort -u); do
            test -f "v3/_nuxt/${c#./}" \
              || { echo "::error::delivered v3 loads _nuxt/${c#./} from its JS but that file is missing"; exit 1; }
            chunks=$((chunks+1))
          done

          echo "delivered v3: $(cat v3/version.json)"
          echo "census: $books books, and api/book, api/chapter and read/ all agree on which ones"
          echo "checked: $(find v3 -name '*.html' -not -path 'v3/.git/*' | wc -l) pages, $refs files they name, $chunks files the JS loads later, $n links out of the home page ($linked)"

      # ---- combine: root is the checkout itself, with /v3 nested under it -----------------------
      - name: Nest the delivered redesign under the site root
        run: |
          # v3 arrives built, so the checkout itself IS the site. Drop the .git that checkout adds —
          # publishing it would put the delivery branch's history on a public web server.
          if [ "${{ steps.v3check.outcome }}" = "success" ]; then
            rm -rf live/v3
            cp -r v3 live/v3
            rm -rf live/v3/.git
          fi

      # ---- say out loud what is actually going up ----------------------------------------------
      # Without this, "the merge went in but the site did not change" looks exactly like "the site
      # changed" — every check mark is green either way. The size is printed because the cleanup
      # step above is the only thing keeping this upload under the Pages limit.
      - name: Report what is being deployed
        run: |
          echo "root  <- main @ ${{ steps.root.outputs.sha }}"
          echo "root  : $(ls -A live | tr '\n' ' ')"
          echo "size  : $(du -sh live | cut -f1)"
          if [ -d live/v3 ]; then echo "/v3/  : included"; else echo "/v3/  : NOT included"; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live
      - id: deployment
        uses: actions/deploy-pages@v4

      # ---- a delivery that arrived but did not ship must be LOUD -------------------------------
      # Pages replaces the WHOLE site every run. So if `v3-dist` was delivered but failed its check,
      # the upload above simply has no /v3/ in it — and a /v3/ that was working five minutes ago
      # becomes a 404, with every check mark still green because v3check is continue-on-error.
      #
      # This runs AFTER the deployment on purpose: the live root has already shipped, which is the
      # property we must never trade away. All this does is refuse to call the run a success.
      - name: Fail if a v3 delivery arrived but did not make it onto the site
        if: steps.v3checkout.outcome == 'success' && steps.v3check.outcome != 'success'
        run: |
          echo "::error::v3-dist was delivered but failed its check, so /v3/ is NOT on the site."
          echo "The root shipped normally. Fix the delivery on aimgit and press ปล่อยเว็บ again."
          exit 1
