name: Deploy to GitHub Pages

# TWO VERSIONS, ONE SITE — root is what people read today, and it comes from `main`.
#   /      = branch `main`    — the live site. Quarto built these files elsewhere and they are
#                               committed as finished HTML, so there is NOTHING to build here:
#                               checking `main` out already gives us the site.
#   /v3/   = branch `v3-dist` — the redesign. ⚠️ NOT source: it holds the ALREADY-BUILT site.
#                               May not exist yet; that is fine and must not fail the run.
#                               Delivered by aimgit, which then fires `repository_dispatch` —
#                               see the `on:` block for why a push to that branch cannot do it.
#
# WHY /v3/ IS DELIVERED AND NOT BUILT HERE: v3 is a Nuxt app and it lives on aimgit (project
# `v3/phrakham`), not here. It is built THERE by the manual job `ปล่อยเว็บ` and the finished files
# are pushed to `v3-dist`. This repo only serves them, because a custom domain can be attached to
# exactly one repository and this is that repository.
# ⇒ so there is no `npm ci`/`npm run build` for v3 here. Building it here would mean copying both
#   v3's source AND its data key into this public repo; delivering the built files does not.
#
# The branch name and the dispatch event name below must match the CI variables on aimgit
# (`PUBLISH_BRANCH`, `PUBLISH_DISPATCH_EVENT`) — aimgit's `tools/ส่งเว็บขึ้น-github.sh` owns those.
on:
  push:
    branches: [main]
  # A delivery of v3 arrives as a push to `v3-dist` — but that CANNOT trigger this file, because
  # GitHub reads the workflow from the ref that was pushed, and `v3-dist` holds the built site only:
  # no .github/ at all. Listing it under `push.branches` would therefore be a lie that reads as
  # working, and the delivery would silently show up on the next unrelated push to main instead.
  # ⇒ aimgit calls the repository_dispatch API right after pushing. That always runs the workflow
  #   file on the DEFAULT branch, which is the copy we can actually see and review.
  repository_dispatch:
    types: [v3-delivered]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Do NOT cancel an in-progress deploy: a cancelled
# deploy-pages run can leave the Pages backend mid-deployment, and the next push
# then fails with "Deployment failed, try again later." Let production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ---- the live site (root) — from `main` --------------------------------------------------
      # NO continue-on-error here on purpose: if the live site cannot be fetched, the run must go
      # red and nothing ships. Shipping a site whose root is missing is worse than not shipping.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live

      # ---- drop what is in the checkout but is not the site ------------------------------------
      # `.claude/worktrees` is AI working copies that were committed here by accident.
      # Two reasons it has to go, not one:
      #   1. it is not the site — and the branch builder we are replacing did not skip it either,
      #      so this is a removal from a live site, not merely a guard against a new one: those
      #      paths turn into 404 the first time this workflow ships, and that is intended.
      #   2. with it the checkout is over the 1 GB a published Pages site may be; without it it
      #      fits. ⛔ No size is written here: what actually goes up is printed every run by the
      #      `du -sh live` line in the report step below, and a size repeated in a comment is a
      #      copy that goes stale without anyone noticing.
      # ⛔ Do not turn this into "delete everything that starts with a dot". `.nojekyll` is a FILE
      #   at the root and it must survive: switching Settings › Pages back to the branch builder is
      #   the rollback for this whole change, and that builder needs `.nojekyll` to serve
      #   `site_libs/` and every other underscore path.
      # The commit is read BEFORE `.git` goes away — that is the only place it can be read from,
      # and the report step at the bottom needs it.
      - id: root
        name: Record the root commit, then remove non-site files from the checkout
        run: |
          echo "sha=$(git -C live rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf live/.git live/.github live/.claude

      # The step above deletes by name, so a typo there would quietly ship the wrong thing.
      # These lines are the proof that it removed what it should and kept what it must. Everything
      # else on the keep-list survives by construction: we copy the checkout and delete three
      # named entries, so nothing can be dropped without changing the line above.
      - name: Check the root still is the site
        run: |
          test -f live/index.html
          test -f live/CNAME
          test -f live/.nojekyll
          for d in .git .github .claude; do
            test ! -e "live/$d" || { echo "::error::live/$d survived the cleanup"; exit 1; }
          done

      # ---- the redesign (/v3/) — already built, delivered on branch `v3-dist` -------------------
      # continue-on-error on the CHECKOUT: `v3-dist` may not exist yet, and a missing branch must
      # not fail the run. No install and no build — the files arrive finished (see header).
      - id: v3checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: v3-dist
          path: v3

      # A delivered site must be able to say which commit it came from, the same way root does.
      # v3's own CI writes version.json; if it is missing, the delivery is not what we expect, so
      # treat it as "no v3 this run" rather than shipping something unidentifiable.
      #
      # WHAT THIS STEP ANSWERS: "did the whole delivery arrive, or only part of it?" ⛔ NOT "does the
      # home page open?" A build that dies half way still writes a perfect home page, so opening one
      # page — or following the links on it — proves nothing about the rest. (On the sister repo
      # pleng.phrakham.life a reviewer deleted the whole _nuxt/ directory from a real build and an
      # earlier version of this check stayed green; on 8 Sep 2026 a reviewer threw away 97% of this
      # delivery, 1543 files down to 52, and the version before this one stayed green too.)
      #
      # HOW COMPLETENESS IS MEASURED WITHOUT NAMING A SINGLE BOOK: the delivery brings its own
      # count. api/books.json is written by the sender and says how many books there are, what each
      # one is called, and which chapter numbers each one has. Every book it names is then looked
      # for in three places — one JSON per book under api/book/, one chapter directory per book
      # under api/chapter/, and one reading page per book under read/ — and every chapter number it
      # lists must be a file in that directory. ⛔ Never write a book name, a book count
      # or a page name into this file: aimgit owns those and they do change (a page moved once
      # already, 29 Aug 2026, /sources → /read), and a copy kept here would go stale without anyone
      # noticing. Reading the numbers out of the delivery keeps them fresh on their own.
      #
      # ⚠️ THE SENDER'S OWN COUNT CANNOT BE THE ONLY RULER. api/books.json travels inside the same
      # push as the files it describes, so a sender that ships less and writes a shorter list agrees
      # with itself and every count above still adds up. (8 Sep 2026: a reviewer cut the delivery to
      # three books and shortened the list to match — 75% of the files gone — and the version before
      # this one stayed green; with one book left, 89% gone, still green.) So the count is measured
      # against a ruler from OUTSIDE the delivery: live/webdata/books.json, the catalogue the root
      # site on `main` uses for its own reading pages. It is built by the older pipeline, it is not
      # in this push, and the incoming delivery cannot change it. It carries no v3 names — only how
      # many books the same Bible has and how many chapters each one has — so nothing here goes
      # stale when v3 renames a page. If that file is ever gone, or comes back in a shape these
      # counts cannot be read out of, the ruler is skipped with a warning — spelled out in the run
      # log, never silently — and never a red: the root site's own file must not take /v3/ down.
      #
      # ⚠️ MISSING IS AN ERROR, EXTRA IS NOT. Every check below asks "is anything the delivery
      # promised absent?" and never "is there anything here I did not expect?" A red here takes
      # /v3/ off the live site completely, so a false red costs as much as a hole that was missed.
      # A new page under read/ that is not a book, a second translation kept one directory deeper,
      # or an empty robots.txt must not take the site down. (8 Sep 2026: the version before this one
      # demanded that read/ match the book list exactly, and refused a whole delivery over a single
      # empty robots.txt — either one would have done it.)
      #
      # ⚠️ WHAT IT STILL CANNOT SEE: these checks count files, weigh them, and read the numbers the
      # sender declares; they do not read the Bible text inside a chapter file. A chapter file with
      # a plausible amount of the wrong text in it would pass. ⛔ So a green here is not a promise
      # that the delivery is right — it is the receiver's shallow second line. The first line is the
      # sender's own: aimgit's tools/สร้างเว็บที่จะปล่อย.sh counts the pages it built against its
      # data before it hands anything over.
      - id: v3check
        if: steps.v3checkout.outcome == 'success'
        continue-on-error: true
        run: |
          test -f v3/index.html
          test -f v3/version.json

          # ---- 1. nothing hollow -----------------------------------------------------------------
          # `test -f` says a file is there, not that anything is inside it. A write that failed part
          # way leaves a 0-byte .js, .css or .html behind, and every check further down still passes
          # while the site is blank in the browser.
          # ⚠️ Only the file kinds that carry the site are looked at. An empty file is perfectly
          # normal for others — an empty robots.txt, an empty marker file — and one of those must
          # never drop /v3/ off the live site. (8 Sep 2026: a reviewer added one empty robots.txt to
          # a good delivery and the version before this one refused the whole thing.)
          empty=$(find v3 -type f -empty -not -path 'v3/.git/*' \
                    \( -name '*.html' -o -name '*.js' -o -name '*.mjs' -o -name '*.css' \
                       -o -name '*.json' \) \
                  | head -3 | tr '\n' ' ')
          test -z "$empty" \
            || { echo "::error::delivered v3 contains empty files, e.g. $empty"; exit 1; }

          # ---- 2. no whole part of the delivery went missing --------------------------------------
          # ⛔ These are the delivery's own directory names, not page names. If aimgit renames one,
          # this step goes red on purpose: the census below reads these directories, so a rename has
          # to be followed here instead of quietly skipped.
          for d in _nuxt __nuxt_content api/book api/chapter read; do
            test -n "$(find "v3/$d" -type f -print -quit 2>/dev/null)" \
              || { echo "::error::v3/$d is missing or holds no files — the delivery is not complete"; exit 1; }
          done
          test -n "$(find v3/_nuxt -name '*.js' -print -quit)" \
            || { echo "::error::delivered v3 has no JS in _nuxt — refusing to publish an empty page"; exit 1; }

          # ---- 3. the census: every book the delivery declares must arrive whole ----------------
          # api/books.json is the sender's own count, carried inside the delivery. It is first
          # weighed against the ruler from outside (see the header), then against itself, and only
          # then against the files. Each book it names has to turn up as book data, as a chapter
          # directory holding a file for every chapter that book says it has, and as a reading page
          # with something on it. ⚠️ The chapter count is what catches a delivery that lost the
          # Bible text but kept one file per book: on 8 Sep 2026 a reviewer left chapter 1 of every
          # book and threw away the other 1,123 files, and the version before this one stayed green.
          # ⚠️ Book data and chapter files are looked for where the site itself fetches them —
          # api/book/<CODE>.json and api/chapter/<CODE>/<n>.json, exactly there. An earlier version
          # accepted a file of that name anywhere at any depth, so a 2-byte file dropped into
          # api/book/xx/ stood in for the real Genesis and this check stayed green (8 Sep 2026).
          # Looking only at the one place the reader's browser looks costs nothing and closes that:
          # a second translation filed one directory deeper (api/book/thsv11/JHN.json) is extra, and
          # extra is never an error, so it still does not read as a book gone missing.
          # ⚠️ The floors on size sit far below anything real — the smallest chapter file in a good
          # delivery runs past 1,700 bytes and the smallest reading page past 9,000 — and far above
          # an empty shell. They are here to catch a file that was created but never filled, not to
          # police size. The reading page is weighed with its blank space taken out, because 5,000
          # spaces is a shell too.
          # ⚠️ Written in python because it has to read numbers out of JSON, and because every gap
          # is collected and reported together: a half-built delivery shows its whole gap in one run
          # instead of one book per re-run. The Thai keys are written as escapes so that no editor
          # or terminal on the way here can quietly break them.
          python3 - <<'PY'
          import json, os, sys

          def die(msg):
              print("::error::" + msg)
              sys.exit(1)

          manifest = "v3/api/books.json"
          if not os.path.isfile(manifest):
              die("v3/api/books.json is missing - the delivery does not say what it should contain")
          try:
              with open(manifest, encoding="utf-8") as fh:
                  said = json.load(fh)
          except Exception as exc:
              die("v3/api/books.json cannot be read: %s" % exc)

          books = said.get("\u0e40\u0e25\u0e48\u0e21") or []          # "เล่ม" = the list of books
          count = said.get("\u0e08\u0e33\u0e19\u0e27\u0e19\u0e40\u0e25\u0e48\u0e21")  # "จำนวนเล่ม" = how many books
          total = said.get("\u0e08\u0e33\u0e19\u0e27\u0e19\u0e1a\u0e17")              # "จำนวนบท"  = how many chapters
          if not books:
              die("v3/api/books.json names no books at all - the delivery is not complete")
          if count is not None and count != len(books):
              die("v3/api/books.json says %s books but names %d of them" % (count, len(books)))

          # Read the chapter list of every book once, and make the manifest agree with itself while
          # doing it. "บทที่มี" is the list of chapter numbers this book actually has. ⚠️ It is not
          # the same as "บท", the number the last chapter carries: Joel is numbered up to 4 and has
          # 3, so reading the number instead of the list would go red on a good delivery.
          # ⛔ If the list ever stops being sent this goes red on purpose, rather than quietly
          # falling back to the number and checking the wrong thing.
          # "ข้อสุดท้าย" is the last verse number of each chapter, one entry per chapter. It is
          # written from the same source and must therefore be exactly as long as the chapter list:
          # shortening one list and forgetting the other is what a hand-trimmed manifest looks like.
          wanted = {}
          for book in books:
              code = book.get("\u0e23\u0e2b\u0e31\u0e2a")          # "รหัส" = the book code, e.g. JHN
              if not code:
                  die("v3/api/books.json has an entry with no book code - it cannot be checked")
              want = book.get("\u0e1a\u0e17\u0e17\u0e35\u0e48\u0e21\u0e35")
              if not isinstance(want, list) or not want:
                  die("v3/api/books.json no longer lists which chapters %s has - the delivery changed shape and this check has to be brought up to date here" % code)
              ends = book.get("\u0e02\u0e49\u0e2d\u0e2a\u0e38\u0e14\u0e17\u0e49\u0e32\u0e22")
              if isinstance(ends, list) and len(ends) != len(want):
                  die("v3/api/books.json disagrees with itself about %s: it lists %d chapters but %d last-verse numbers" % (code, len(want), len(ends)))
              wanted[code] = want
          here_chapters = sum(len(v) for v in wanted.values())
          last = sum(b.get("\u0e1a\u0e17") for b in books
                     if isinstance(b.get("\u0e1a\u0e17"), int))
          if isinstance(total, int) and total != last:
              die("v3/api/books.json says %d chapters but its books add up to %d" % (total, last))

          # ---- the ruler from outside the delivery ----------------------------------------------
          # live/webdata/books.json belongs to the root site on `main`. Same Bible, different
          # pipeline, not in this push. Only counts are compared - no name from it is ever matched
          # against a v3 name, so v3 may rename anything it likes. Missing ruler = skip, never red.
          # ⚠️ EVERY WAY OUT OF THE MEASUREMENT SAYS SO OUT LOUD. Skipping quietly is worse than not
          # having a ruler at all, because the run then looks exactly like a measured one. The file
          # can go three ways, and each of them ends in a warning: it cannot be read, it can be read
          # but is no longer a list of books, or it is a list of books that no longer carries
          # chapter numbers - in that last one the book half is still measured and only the chapter
          # half is skipped. (8 Sep 2026: a reviewer replaced the ruler with an object, with an
          # empty list, and with 66 books stripped of their chapters, then threw away 1,123 of the
          # delivery's 1,189 chapters; all three runs passed without a single line of warning,
          # while the comment here promised a warning whenever the ruler was skipped.)
          ruler = "live/webdata/books.json"
          out_books = out_chapters = 0
          skipped = None
          try:
              with open(ruler, encoding="utf-8") as fh:
                  rows = json.load(fh)
          except Exception as exc:
              skipped = "it could not be read (%s)" % exc
          else:
              if not isinstance(rows, list) or not rows:
                  skipped = "it is no longer a list of books with anything in it"
              else:
                  out_books = len(rows)
                  out_chapters = sum(len(row.get("chapters") or []) for row in rows
                                     if isinstance(row, dict))
          if skipped:
              print("::warning::%s was not used as a ruler because %s - this run has no ruler from "
                    "outside the delivery, so api/books.json is only checked against itself"
                    % (ruler, skipped))
          elif not out_chapters:
              print("::warning::%s no longer says which chapters its books have, so this run could "
                    "measure the book count against it but not the chapter count" % ruler)
          if out_books:
              # A tenth is the whole slack. The two catalogues describe the same Bible, so they
              # should land on the same numbers; a delivery that declares less than nine tenths of
              # what the root site already publishes is a delivery that lost something.
              if len(books) * 10 < out_books * 9:
                  die("the root site's own catalogue has %d books but this delivery declares only "
                      "%d - it is not a whole Bible. If that is on purpose, this check has to be "
                      "brought up to date here." % (out_books, len(books)))
              if out_chapters and here_chapters * 10 < out_chapters * 9:
                  die("the root site's own catalogue has %d chapters but this delivery declares "
                      "only %d - it is not a whole Bible. If that is on purpose, this check has to "
                      "be brought up to date here." % (out_chapters, here_chapters))
              print("ruler: the root site's catalogue has %d books and %d chapters; this delivery "
                    "declares %d and %d" % (out_books, out_chapters, len(books), here_chapters))

          gaps = []
          for book in books:
              code = book["\u0e23\u0e2b\u0e31\u0e2a"]
              want = wanted[code]
              data = "v3/api/book/%s.json" % code
              if not os.path.isfile(data):
                  gaps.append("%s has no book data at api/book/%s.json" % (code, code))
                  continue
              holder = "v3/api/chapter/%s" % code
              if not os.path.isdir(holder):
                  gaps.append("%s has no chapter directory at api/chapter/%s" % (code, code))
                  continue
              here = set(os.listdir(holder))
              short = [n for n in want if ("%s.json" % n) not in here]
              if short:
                  gaps.append("%s is missing %d of its %d chapters in %s, e.g. %s"
                              % (code, len(short), len(want), holder,
                                 ", ".join(str(n) for n in short[:5])))
                  continue
              thin = [n for n in want
                      if os.path.getsize(os.path.join(holder, "%s.json" % n)) < 256]
              if thin:
                  gaps.append("%d of %s's %d chapter files are under 256 bytes - shells, not "
                              "chapters, e.g. %s"
                              % (len(thin), code, len(want),
                                 ", ".join(str(n) for n in thin[:5])))
                  continue
              page = "v3/read/%s/index.html" % code
              if not os.path.isfile(page):
                  gaps.append("%s has data but no reading page at /v3/read/%s" % (code, code))
                  continue
              with open(page, "rb") as fh:
                  filled = len(b"".join(fh.read().split()))
              if filled < 1024:
                  gaps.append("the reading page for %s holds only %d bytes once blank space is "
                              "taken out - a shell, not a page" % (code, filled))

          if gaps:
              die("the delivery declares %d books and %d of them did not arrive whole: %s"
                  % (len(books), len(gaps), "; ".join(gaps[:5])))

          print("census: api/books.json declares %d books and every one of them arrived whole "
                "- book data, every one of its %d chapters, "
                "and a reading page" % (len(books), here_chapters))
          PY

          # ---- 4. the home page must lead somewhere -----------------------------------------------
          # The links are read out of the delivered file. ⛔ Do not write a page name here.
          # Every shape the root has had, or could have, is accepted, because all of them work in a
          # browser and none of them may fail here: a real page (href="/v3/read"), the old redirect
          # stub (url=/v3/read), single quotes, and links written relative to the root (href="read").
          # ⚠️ A link back to the home page itself — rel="canonical" href="/v3/", which Nuxt writes on
          # its own, or a stub that redirects to /v3/ — is not a way out and is not counted. A page
          # whose only links point at itself is not a home page.
          # ⚠️ WHAT IS CHECKED IS THE FIRST STEP OF THE PATH, NOT THE WHOLE OF IT. v3 is one page
          # that redraws itself as the reader moves, and 404.html — the copy of the home page that
          # GitHub serves whenever a path has no file — is what lets a deep address work: the reader
          # gets the app and the app draws the right chapter. So /v3/read/JHN/3 and /v3/read/JHN/3.16
          # open perfectly well while no such file exists anywhere in the delivery. An earlier
          # version demanded a file for every link and would have gone red on both, and a red here
          # takes the whole of /v3/ off the site — so a designer adding a "read on" button to the
          # home page would have taken the site down without touching anything to do with this file
          # (8 Sep 2026). What still has bite: the section the link starts in must have been
          # delivered, so a link to /v3/sources when sources/ was never sent is still red.
          # ⛔ THAT RELAXATION LEANS ON 404.html, SO 404.html IS CHECKED AND NOT ASSUMED. It is the
          # only reason a deep address opens at all: GitHub serves it for every path with no file of
          # its own. Without it every /v3/read/JHN/3 in the delivery dies in the reader's browser
          # while everything in this run looks normal. (8 Sep 2026, one round after this section
          # started leaning on that file: a reviewer deleted 404.html, then deleted it while the
          # home page linked to a verse, and this check stayed green both times.)
          test -s v3/404.html \
            || { echo "::error::v3/404.html is missing or empty — every address under /v3/ that has no file of its own is served from it, so deep links would all land on GitHub's own not-found page"; exit 1; }

          linked=
          n=0
          for raw in $(grep -ohE "(href|url)=(\"[^\"]*\"|'[^']*'|[^\"'[:space:]>]+)" v3/index.html \
                       | sed -E "s/^(href|url)=//; s/^[\"']//; s/[\"']\$//" | sort -u); do
            t=${raw%%\?*}; t=${t%%#*}
            case "$t" in ""|"#"*|*:*|"//"*) continue ;; esac
            case "$t" in
              /v3|/v3/*) t=${t#/v3} ;;
              /*) continue ;;
              *) t="/$t" ;;
            esac
            t=$(printf '%b' "${t//%/'\x'}")
            t=${t%/}
            test -n "$t" || continue
            case "${t##*/}" in
              *.js|*.mjs|*.css|*.json|*.map|*.txt|*.xml|*.webmanifest|*.ico|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.avif|*.woff|*.woff2|*.ttf|*.mp3|*.pdf) continue ;;
            esac
            # ⚠️ A page name is allowed to contain a dot — our Bible references are written with one,
            # as in /v3/read/JHN/3.16 — so "has a dot" must never be read as "is a file". Only the
            # file endings listed just above are treated as files.
            seg=${t#/}; seg=${seg%%/*}
            [ -e "v3/$seg" ] || [ -f "v3/$seg.html" ] \
              || { echo "::error::the home page links to /v3$t but /v3/$seg was not delivered at all"; exit 1; }
            n=$((n+1))
            case " $linked " in *" $seg "*) continue ;; esac   # two links, one section
            linked="$linked $seg"
          done
          [ "$n" -gt 0 ] \
            || { echo "::error::v3/index.html links to no other page under /v3/ — that is not a home page"; exit 1; }

          # ---- 5. every file the delivered pages name must be there -------------------------------
          # ⚠️ This reads EVERY delivered page, not only the home page and its neighbours. The home
          # page names its own bundle and nothing else, so a delivery that lost most of _nuxt/ would
          # sail through if only the home page were read.
          # ⚠️ Thai file names are percent-encoded inside the HTML but are Thai bytes on disk, so the
          # path has to be decoded before it is tested — comparing the raw text would report every
          # valid Thai-named file as missing. (Same trap aimgit hit on 29 Aug 2026.)
          refs=0
          for p in $(grep -ohrE "[\"']/v3/[^\"']+" --include='*.html' --exclude-dir=.git v3 \
                     | cut -c2- | sort -u); do
            p=${p%%\?*}; p=${p%%#*}
            case "${p##*/}" in
              *.js|*.mjs|*.css|*.json|*.map|*.txt|*.xml|*.webmanifest|*.ico|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.avif|*.woff|*.woff2|*.ttf|*.mp3|*.pdf) ;;
              *) continue ;;
            esac
            p=$(printf '%b' "${p//%/'\x'}")
            test -f "v3${p#/v3}" \
              || { echo "::error::delivered v3 references $p but the file is missing"; exit 1; }
            refs=$((refs+1))
          done

          # ---- 6. the files the JS fetches later must be there -------------------------------------
          # ⚠️ A page names only the handful of files it needs to start. The rest of the app is
          # fetched later, by name, from inside the JS — and those names appear nowhere in any HTML,
          # so a delivery that lost them looks perfect to sections 4 and 5 and then breaks under the
          # reader's first click. (8 Sep 2026: a reviewer deleted every _nuxt file the four pages
          # then being read did not name, and the check before this one stayed green.)
          # ⚠️ THE BUNDLER WRITES THOSE NAMES IN MORE THAN ONE SPELLING and reading only one of them
          # leaves a hole of exactly the kind this section exists to close: an earlier version read
          # only the "./name.js" spelling, so deleting the whole of _nuxt/builds/ — which the JS asks
          # for in backticks — passed unnoticed (8 Sep 2026). All three spellings are read here.
          # ⚠️ Only names with a directory in them are followed. A bare name in backticks is usually
          # a library's own fallback string and need not exist: a good delivery carries
          # `sqlite3-opfs-async-proxy.js` in its JS and no such file, on purpose.
          # ⚠️ Where a name is built at run time — `api/chapter/${code}` — the name cannot be known
          # here, so what is checked is that the directory it is built inside was delivered and is
          # not empty. That is what catches a whole fetched-later directory going missing.
          chunks=0
          for c in $(grep -ohE '"\./[A-Za-z0-9_.-]+\.(js|css)"' v3/_nuxt/*.js | tr -d '"' | sort -u); do
            test -f "v3/_nuxt/${c#./}" \
              || { echo "::error::delivered v3 loads _nuxt/${c#./} from its JS but that file is missing"; exit 1; }
            chunks=$((chunks+1))
          done
          for c in $(grep -ohE '`[A-Za-z0-9_][A-Za-z0-9_./-]*\.(js|mjs|css|json)`' v3/_nuxt/*.js \
                     | tr -d '`' | sort -u); do
            case "$c" in */*) ;; *) continue ;; esac
            { [ -f "v3/_nuxt/$c" ] || [ -f "v3/$c" ]; } \
              || { echo "::error::delivered v3 fetches $c from its JS but that file is missing"; exit 1; }
            chunks=$((chunks+1))
          done
          holds=0
          for d in $(grep -ohE '`[A-Za-z0-9_][A-Za-z0-9_./-]*/\$\{' v3/_nuxt/*.js \
                     | sed -E 's/^.//; s|/\$\{$||' | sort -u); do
            case "$d" in */*) ;; *) continue ;; esac
            test -n "$(find "v3/_nuxt/$d" "v3/$d" -type f -print -quit 2>/dev/null)" \
              || { echo "::error::delivered v3 fetches files out of $d from its JS but that directory is missing or empty"; exit 1; }
            holds=$((holds+1))
          done

          echo "delivered v3: $(cat v3/version.json)"
          echo "checked: $(find v3 -name '*.html' -not -path 'v3/.git/*' | wc -l) pages, $refs files they name, $chunks files and $holds directories the JS loads later, $n links out of the home page (into$linked)"

      # ---- combine: root is the checkout itself, with /v3 nested under it -----------------------
      - name: Nest the delivered redesign under the site root
        run: |
          # v3 arrives built, so the checkout itself IS the site. Drop the .git that checkout adds —
          # publishing it would put the delivery branch's history on a public web server.
          if [ "${{ steps.v3check.outcome }}" = "success" ]; then
            rm -rf live/v3
            cp -r v3 live/v3
            rm -rf live/v3/.git
          fi

      # ---- say out loud what is actually going up ----------------------------------------------
      # Without this, "the merge went in but the site did not change" looks exactly like "the site
      # changed" — every check mark is green either way. The size is printed because the cleanup
      # step above is the only thing keeping this upload under the Pages limit.
      - name: Report what is being deployed
        run: |
          echo "root  <- main @ ${{ steps.root.outputs.sha }}"
          echo "root  : $(ls -A live | tr '\n' ' ')"
          echo "size  : $(du -sh live | cut -f1)"
          if [ -d live/v3 ]; then echo "/v3/  : included"; else echo "/v3/  : NOT included"; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live
      - id: deployment
        uses: actions/deploy-pages@v4

      # ---- a delivery that arrived but did not ship must be LOUD -------------------------------
      # Pages replaces the WHOLE site every run. So if `v3-dist` was delivered but failed its check,
      # the upload above simply has no /v3/ in it — and a /v3/ that was working five minutes ago
      # becomes a 404, with every check mark still green because v3check is continue-on-error.
      #
      # This runs AFTER the deployment on purpose: the live root has already shipped, which is the
      # property we must never trade away. All this does is refuse to call the run a success.
      - name: Fail if a v3 delivery arrived but did not make it onto the site
        if: steps.v3checkout.outcome == 'success' && steps.v3check.outcome != 'success'
        run: |
          echo "::error::v3-dist was delivered but failed its check, so /v3/ is NOT on the site."
          echo "The root shipped normally. Fix the delivery on aimgit and press ปล่อยเว็บ again."
          exit 1
