<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="ss-title ss-desc" font-family="'Noto Sans Thai','Sarabun',sans-serif">
  <title id="ss-title">การรัดตัวเรือและกู้เรือชูชีพกลางพายุ (กิจการ 27:16-17)</title>
  <desc id="ss-desc">แผนภาพเรือสินค้าโรมันกลางพายุ แสดงสองสิ่งที่ลูกเรือทำเพื่อรักษาเรือไม่ให้พัง หมายเลขหนึ่งคือการกว้านเรือชูชีพลำเล็กที่ลากตามท้ายเรือขึ้นมาไว้บนเรือใหญ่ หมายเลขสองคือการเอาเชือกเส้นใหญ่ลอดใต้ท้องเรือแล้วรัดรอบลำเรือหลายเส้น เพื่อยึดแผ่นไม้ของเรือไม่ให้แตกออกจากแรงคลื่น เส้นประคือช่วงของเชือกที่อยู่ใต้น้ำลอดใต้ท้องเรือ</desc>

  <!-- sea -->
  <path d="M0,340 Q56,328 112,340 T224,340 T336,340 T448,340 T560,340 T672,340 T784,340 T896,340 L900,340 L900,580 L0,580 Z" fill="#AEC3C7"/>
  <g stroke="#8ea3a6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M46,372 q22,-9 44,0"/><path d="M150,392 q22,-9 44,0"/>
    <path d="M300,378 q22,-9 44,0"/><path d="M540,394 q22,-9 44,0"/>
    <path d="M690,376 q22,-9 44,0"/><path d="M812,392 q22,-9 44,0"/>
  </g>

  <!-- wind hint -->
  <path d="M64,120 q130,-24 268,6" fill="none" stroke="#7d8f92" stroke-width="1.6" stroke-dasharray="7 6"/>
  <path d="M326,132 l16,-6 -6,15 Z" fill="#7d8f92"/>
  <text x="80" y="104" font-size="16" font-weight="700" fill="#5f7377">ลมพายุยูรากีโล</text>

  <!-- ============ ship hull ============ -->
  <path d="M214,268 C206,254 220,246 234,254 L620,254 C644,254 662,258 668,270
           C682,312 640,380 452,386 C322,390 250,360 226,312 C218,296 214,282 214,268 Z"
        fill="#F0E4CE" stroke="#6d3610" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="234" y1="254" x2="620" y2="254" stroke="#6d3610" stroke-width="2.2"/>
  <!-- plank hint lines -->
  <path d="M232,272 L622,272 M240,292 C360,300 520,298 630,290" fill="none" stroke="#d8c39a" stroke-width="1.4"/>

  <!-- high curved stern post (aphlaston) -->
  <path d="M636,254 C660,222 660,190 636,176 C623,169 612,176 618,189 C629,193 634,206 627,223 C621,239 630,250 638,254"
        fill="none" stroke="#8B4513" stroke-width="2.6" stroke-linecap="round"/>
  <!-- raked foremast (artemon) at bow -->
  <line x1="256" y1="254" x2="214" y2="196" stroke="#8B4513" stroke-width="2.6" stroke-linecap="round"/>
  <!-- steering oar -->
  <line x1="612" y1="264" x2="650" y2="356" stroke="#8B4513" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M642,342 l18,9 -8,18 -18,-9 Z" fill="#F0E4CE" stroke="#6d3610" stroke-width="2"/>

  <!-- main mast + yard + shortened storm sail -->
  <line x1="422" y1="254" x2="422" y2="118" stroke="#8B4513" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="358" y1="148" x2="486" y2="148" stroke="#8B4513" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M362,150 C402,162 442,162 482,150 L479,206 C442,216 402,216 365,206 Z"
        fill="#FAF6F0" stroke="#8C7A4E" stroke-width="1.8"/>
  <path d="M384,156 L381,208 M422,159 L422,211 M460,156 L463,208" stroke="#e3d7bd" stroke-width="1.3"/>

  <!-- ===== (2) undergirding cables: solid over/above water, dashed underwater ===== -->
  <g stroke="#5a4a2a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M332,248 C336,288 334,316 332,340"/>
    <path d="M404,248 C408,294 406,320 404,342"/>
    <path d="M476,248 C480,288 478,314 476,340"/>
  </g>
  <g fill="#5a4a2a"><circle cx="332" cy="247" r="3.6"/><circle cx="404" cy="247" r="3.6"/><circle cx="476" cy="247" r="3.6"/></g>
  <g stroke="#6f5d38" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="5 6">
    <path d="M332,340 C328,358 328,368 334,376"/>
    <path d="M404,342 C400,362 400,374 406,384"/>
    <path d="M476,340 C472,358 472,366 478,374"/>
  </g>

  <!-- ===== (1) ship's boat (skiff) being hauled UP at the stern ===== -->
  <path d="M624,250 C674,242 712,258 706,286" fill="none" stroke="#5a4a2a" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(726,300) rotate(16)">
    <path d="M-46,-9 L46,-9 C54,-9 54,5 45,15 C20,26 -20,26 -45,15 C-54,5 -54,-9 -46,-9 Z"
          fill="#F0E4CE" stroke="#6d3610" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="-46" y1="-9" x2="46" y2="-9" stroke="#6d3610" stroke-width="2"/>
    <line x1="-28" y1="-9" x2="-28" y2="6" stroke="#c9b485" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#c9b485" stroke-width="1.6"/>
    <line x1="28" y1="-9" x2="28" y2="6" stroke="#c9b485" stroke-width="1.6"/>
  </g>

  <!-- ===== number markers ===== -->
  <line x1="726" y1="278" x2="726" y2="246" stroke="#8B4513" stroke-width="1.5"/>
  <circle cx="726" cy="230" r="16" fill="#8B4513"/>
  <text x="726" y="236" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <line x1="404" y1="388" x2="404" y2="410" stroke="#8B4513" stroke-width="1.5"/>
  <circle cx="404" cy="426" r="16" fill="#8B4513"/>
  <text x="404" y="432" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- ===== legend (own rows, below) ===== -->
  <circle cx="182" cy="486" r="12" fill="#8B4513"/>
  <text x="182" y="491" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="204" y="491" font-size="16" font-weight="700" fill="#4a3a20" text-anchor="start">กว้านเรือชูชีพขึ้นมาไว้บนเรือใหญ่ (ข้อ 16)</text>

  <circle cx="182" cy="520" r="12" fill="#8B4513"/>
  <text x="182" y="525" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="204" y="525" font-size="16" font-weight="700" fill="#4a3a20" text-anchor="start">เอาเชือกลอดใต้ท้องเรือ รัดรอบลำเรือไว้กันเรือแตก (ข้อ 17)</text>

  <text x="450" y="556" font-size="13.5" fill="#6b5c3d" text-anchor="middle">เส้นประ = ช่วงเชือกที่ลอดอยู่ใต้ท้องเรือ (ใต้น้ำ)</text>
</svg>
