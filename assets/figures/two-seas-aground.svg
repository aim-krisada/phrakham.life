<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="ts-title ts-desc" font-family="'Noto Sans Thai','Sarabun',sans-serif">
  <title id="ts-title">‘ที่ซึ่งทะเลสองแห่งมาบรรจบกัน’ — หัวเรือติดแน่น ท้ายเรือแตก (กิจการ 27:41)</title>
  <desc id="ts-desc">แผนภาพมองจากด้านบน แผ่นดินอยู่ทางซ้ายและมีเกาะเล็กหรือแหลมยื่นอยู่ทางขวา ระหว่างกลางมีสันดอนทรายใต้น้ำพาดขวางอยู่ มีน้ำทะเลอยู่ทั้งด้านบนและด้านล่างของสันดอน กระแสน้ำจากทั้งสองด้านไหลมาปะทะกันตรงสันดอนนั้น เรือแล่นมาจากด้านล่างขวาแล้วหัวเรือปักเข้าไปในสันดอนจนติดแน่นขยับไม่ได้ ส่วนท้ายเรือยังอยู่ในน้ำเปิดที่คลื่นซัดแรง ค่อย ๆ แตกออกเป็นชิ้น ๆ มีไม้กระดานหลุดลอยอยู่รอบท้ายเรือ</desc>

  <!-- ======= sea (two bodies, one above the bar and one below) ======= -->
  <rect x="0" y="0" width="900" height="600" fill="#AEC3C7"/>
  <g stroke="#8ea3a6" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M120,74 q22,-9 44,0"/><path d="M340,50 q22,-9 44,0"/><path d="M620,80 q22,-9 44,0"/>
    <path d="M180,470 q22,-9 44,0"/><path d="M760,462 q22,-9 44,0"/>
  </g>
  <text x="450" y="46" font-size="17" font-weight="700" fill="#5f7377" text-anchor="middle">ทะเลด้านหนึ่ง</text>
  <text x="200" y="512" font-size="17" font-weight="700" fill="#5f7377" text-anchor="middle">ทะเลอีกด้านหนึ่ง</text>

  <!-- ======= land: mainland shore (left) ======= -->
  <path d="M0,120 C56,146 92,190 108,246 C122,296 118,348 96,400 C74,452 36,486 0,504 Z"
        fill="#E4D2AE" stroke="#cbb589" stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#8f8069" stroke="#6f6350" stroke-width="1.6">
    <path d="M40,200 l20,-13 18,11 -6,17 -25,3 Z"/>
    <path d="M28,410 l17,-11 15,11 -6,13 -20,2 Z"/>
  </g>
  <text x="34" y="316" font-size="16" font-weight="700" fill="#6b5c3d">แผ่นดิน</text>

  <!-- ======= land: small island / jutting point (right) ======= -->
  <path d="M900,168 C852,186 812,220 798,262 C784,306 792,352 818,388 C842,420 874,438 900,446 Z"
        fill="#E4D2AE" stroke="#cbb589" stroke-width="2.4" stroke-linejoin="round"/>
  <g fill="#8f8069" stroke="#6f6350" stroke-width="1.6">
    <path d="M834,244 l19,-12 17,11 -6,16 -24,2 Z"/>
  </g>
  <text x="874" y="322" font-size="16" font-weight="700" fill="#6b5c3d" text-anchor="end">เกาะเล็ก /</text>
  <text x="874" y="344" font-size="16" font-weight="700" fill="#6b5c3d" text-anchor="end">แหลมที่ยื่นออกมา</text>

  <!-- ======= the shoal: a submerged sand bar bridging the two lands ======= -->
  <path d="M100,262 C210,236 300,244 400,262 C500,280 600,266 700,250 C748,242 776,246 802,258
           C778,300 750,312 700,318 C600,330 500,320 400,332 C300,344 200,338 104,324 Z"
        fill="#EBDCBB" fill-opacity="0.9" stroke="#c7ad78" stroke-width="2.6" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <g fill="#d8c092" opacity="0.85">
    <ellipse cx="250" cy="292" rx="34" ry="12"/><ellipse cx="560" cy="292" rx="30" ry="11"/>
    <ellipse cx="690" cy="284" rx="24" ry="9"/>
  </g>
  <text x="196" y="222" font-size="16" font-weight="700" fill="#6b5c3d" text-anchor="middle">สันดอนทรายใต้น้ำ (ตื้น)</text>
  <text x="196" y="243" font-size="13.5" fill="#6b5c3d" text-anchor="middle">เส้นประ = อยู่ใต้ผิวน้ำ มองไม่เห็น</text>

  <!-- ======= converging currents: from above and from below onto the bar ======= -->
  <g fill="none" stroke="#3f5457" stroke-width="3.2" stroke-linecap="round">
    <path d="M330,110 C326,152 330,186 334,232"/>
    <path d="M636,120 C640,160 636,192 632,228"/>
    <path d="M300,432 C304,398 300,372 296,344"/>
    <path d="M712,424 C708,392 712,368 716,340"/>
  </g>
  <g fill="#3f5457">
    <path d="M334,244 l-9,-18 18,0 Z"/>
    <path d="M632,240 l-9,-18 18,0 Z"/>
    <path d="M296,332 l-9,18 18,0 Z"/>
    <path d="M716,328 l-9,18 18,0 Z"/>
  </g>
  <text x="636" y="106" font-size="15" font-weight="700" fill="#3f5457" text-anchor="middle">กระแสน้ำ</text>
  <text x="712" y="446" font-size="15" font-weight="700" fill="#3f5457" text-anchor="middle">กระแสน้ำ</text>

  <!-- ======= the ship, seen from above: bow driven into the bar, stern out in the surf ======= -->
  <!-- breaking surf on the open-water side, hitting the stern -->
  <g fill="none" stroke="#FAF6F0" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <path d="M556,452 q26,-16 52,0"/><path d="M600,486 q26,-16 52,0"/><path d="M520,486 q26,-16 52,0"/>
    <path d="M566,516 q26,-16 52,0"/>
  </g>
  <g transform="translate(430,286) rotate(-45) scale(0.9)">
    <!-- hull in plan: pointed bow at local (0,0), rounded stern at local (0,255) -->
    <path d="M0,0 C24,26 40,64 40,110 L40,214 C40,240 26,254 0,254 C-26,254 -40,240 -40,214 L-40,110 C-40,64 -24,26 0,0 Z"
          fill="#F0E4CE" stroke="#6d3610" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- deck detail: thwarts + mast step -->
    <g stroke="#d8c39a" stroke-width="2.4">
      <line x1="-30" y1="112" x2="30" y2="112"/><line x1="-34" y1="150" x2="34" y2="150"/>
      <line x1="-36" y1="188" x2="36" y2="188"/>
    </g>
    <circle cx="0" cy="132" r="9" fill="#8B4513"/>
    <!-- the stern is coming apart: planks springing off the after end -->
    <g stroke="#6d3610" stroke-width="2.6" fill="#F0E4CE" stroke-linejoin="round">
      <path d="M-42,206 l-30,10 4,15 30,-10 Z"/>
      <path d="M42,214 l32,6 -3,15 -32,-6 Z"/>
      <path d="M-16,262 l10,32 -15,4 -10,-32 Z"/>
      <path d="M22,258 l16,28 -14,7 -16,-28 Z"/>
    </g>
    <path d="M-40,236 C-16,246 16,246 40,236" fill="none" stroke="#6d3610" stroke-width="3"
          stroke-dasharray="9 8" stroke-linecap="round"/>
  </g>

  <!-- sand heaped over the buried bow: translucent, so the bow reads as buried IN the bar -->
  <path d="M386,266 C366,290 370,312 396,326 C424,346 464,340 482,312 C494,292 490,278 478,264 C450,272 414,272 386,266 Z"
        fill="#EBDCBB" fill-opacity="0.82" stroke="#c7ad78" stroke-width="2.4" stroke-dasharray="9 7" stroke-linejoin="round"/>
  <!-- the buried part of the bow, seen through the sand -->
  <g transform="translate(430,286) rotate(-45) scale(0.9)">
    <path d="M-40,104 C-40,60 -24,26 0,0 C24,26 40,60 40,104" fill="none"
          stroke="#6d3610" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
    <g stroke="#a8894f" stroke-width="2.2" stroke-linecap="round">
      <line x1="-52" y1="34" x2="-32" y2="44"/><line x1="52" y1="34" x2="32" y2="44"/>
      <line x1="-56" y1="72" x2="-36" y2="78"/><line x1="56" y1="72" x2="36" y2="78"/>
    </g>
  </g>

  <!-- ======= the two labels — the men…de pair ======= -->
  <line x1="424" y1="276" x2="306" y2="192" stroke="#4a3a20" stroke-width="2" stroke-linecap="round"/>
  <circle cx="424" cy="276" r="4" fill="#4a3a20"/>
  <text x="300" y="166" font-size="19" font-weight="700" fill="#4a3a20" text-anchor="end">หัวเรือ — ปักติดแน่น</text>
  <text x="300" y="188" font-size="15.5" fill="#6b5c3d" text-anchor="end">จมอยู่ในทราย ขยับไม่ได้เลย</text>

  <line x1="604" y1="428" x2="682" y2="474" stroke="#4a3a20" stroke-width="2" stroke-linecap="round"/>
  <circle cx="604" cy="428" r="4" fill="#4a3a20"/>
  <text x="692" y="480" font-size="19" font-weight="700" fill="#4a3a20">ท้ายเรือ — ถูกคลื่นซัด</text>
  <text x="692" y="502" font-size="15.5" fill="#6b5c3d">จนแตกออกทีละน้อย</text>

  <!-- direction the ship came from -->
  <path d="M676,586 C640,554 600,514 566,470" fill="none" stroke="#5b4a2c" stroke-width="2.6"
        stroke-dasharray="8 7" stroke-linecap="round"/>
  <text x="700" y="580" font-size="13.5" fill="#5b4a2c">ทางที่เรือแล่นเข้ามา</text>

  <!-- ======= footer ======= -->
  <rect x="0" y="536" width="900" height="64" fill="#EFE7DC" opacity="0.94"/>
  <text x="450" y="562" font-size="17" font-weight="700" fill="#4a3a20" text-anchor="middle">กระแสน้ำสองด้านมาปะทะกันจนเกิดสันดอนตื้นคั่นกลาง — หัวเรือ ‘นิ่ง’ ตัดกับท้ายเรือ ‘แตก’ ในข้อ 41</text>
  <text x="450" y="586" font-size="13.5" fill="#6b5c3d" text-anchor="middle">‘ที่ซึ่งทะเลสองแห่งมาบรรจบกัน’ (τόπος διθάλασσος) · ภาพนี้เขียนตามความเข้าใจหนึ่งของภูมิประเทศแบบนี้ ไม่ได้ชี้ว่าเป็นจุดใดบนเกาะมอลตา</text>
</svg>
