<svg xmlns="http://www.w3.org/2000/svg" width="960" height="578" viewBox="0 0 960 578" role="img" aria-labelledby="rm-title rm-desc" font-family="'Noto Sans Thai','Sarabun',sans-serif">
<title id="rm-title">แผนที่เส้นทางเรือ กิจการ 27:4-8 — ลมพัดเรือหลงจากแผนเดิม</title>
<desc id="rm-desc">แผนที่แสดงมุมทะเลระหว่างเมืองมิราในเอเชียไมเนอร์ เกาะครีต และท่างาม ลูกศรสีน้ำเงินคือลมที่พัดต้านลงมาจากทิศตะวันตกเฉียงเหนือ เส้นสีเขียวคือเส้นทางปกติที่ตั้งใจจะแล่นไปทางตะวันตกเหนือเกาะครีต เส้นสีแดงคือเส้นทางที่ไปจริงซึ่งถูกลมพัดให้เบนลงไปด้านใต้ของเกาะครีต ผ่านแหลมสัลโมเนไปยังท่างามใกล้เมืองลาเซีย เส้นสีดำคือเส้นทางเปาโลที่แล่นมาจากซีซารียาผ่านไซดอน</desc>
