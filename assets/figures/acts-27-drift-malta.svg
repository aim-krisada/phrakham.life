<svg xmlns="http://www.w3.org/2000/svg" width="960" height="578" viewBox="0 0 960 578" role="img" aria-labelledby="dm-title dm-desc" font-family="'Noto Sans Thai','Sarabun',sans-serif">
<title id="dm-title">แผนที่ภาพรวม กิจการ 27:27 — เรือถูกพายุซัดจากเกาะครีตถึงเกาะมอลตาสิบสี่วันสิบสี่คืน</title>
<desc id="dm-desc">แผนที่ทะเลเมดิเตอร์เรเนียนตอนกลางแบบมุมกว้าง แสดงเกาะครีตทางขวา เกาะมอลตาทางซ้าย เกาะซิซิลีและอิตาลีมุมบนซ้าย และชายฝั่งแอฟริกาเหนือกับอ่าวเซอร์ทิสด้านล่าง เส้นสีแดงคือเส้นทางที่เรือถูกพายุซัดลอยจากเกาะคาวดาใต้เกาะครีต โค้งลงไปทางใต้เฉียดอ่าวเซอร์ทิสแล้ววกขึ้นไปยังเกาะมอลตา เส้นสีเขียวประคือแผนเดิมที่ตั้งใจจะมุ่งไปอิตาลี ลูกศรสีน้ำเงินคือลมพายุที่พัดมาจากทิศตะวันออกเฉียงเหนือ กล่องข้อความทางขวาสรุปว่าเรือลอยราวสิบสี่วัน ระยะประมาณ 480 ไมล์ทะเล หรือราว 880 กิโลเมตร ด้วยอัตราราว 1.5 นอต ตามการคำนวณของเจมส์ สมิธ เส้นทางที่ลอยเป็นการสันนิษฐานของนักวิชาการ ไม่ใช่เส้นทางที่พระคัมภีร์บันทึกไว้</desc>
